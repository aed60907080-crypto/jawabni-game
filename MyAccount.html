  <title>حسابي — جاوبني</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&family=Tajawal:wght@300;400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css" crossorigin="anonymous" referrerpolicy="no-referrer" />

  <style>
    :root{
      --ink:#04120f;
      --ink-deep:#020b09;
      --surface:#0d332d;
      --surface-light:#154a41;
      --glass:rgba(21,74,65,.45);
      --gold:#e7b740;
      --gold-soft:#f7dd9c;
      --gold-deep:#b6851d;
      --coral:#ff6b4d;
      --coral-dim:#e04a2c;
      --blue:#4a9bff;
      --ivory:#f5f1e6;
      --muted:#9fc2bb;
      --line:rgba(231,183,64,.22);
      --line-strong:rgba(231,183,64,.5);
      --shadow-lg:0 30px 70px rgba(0,0,0,.55);
    }

    *{ box-sizing:border-box; }

    body{
      margin:0;
      background:var(--ink);
      color:var(--ivory);
      font-family:'Tajawal', sans-serif;
      min-height:100vh;
      overflow-x:hidden;
      padding-bottom:50px;
    }

    /* ---------- background ---------- */
    .bg-fx{
      position:fixed; inset:0; z-index:-2; overflow:hidden;
      background:
        radial-gradient(1000px 600px at 85% -10%, #145145 0%, transparent 60%),
        radial-gradient(900px 620px at 10% 5%,  #123f37 0%, transparent 58%),
        radial-gradient(700px 700px at 50% 110%, #1a5b4d 0%, transparent 60%),
        linear-gradient(180deg, #061814 0%, var(--ink) 55%, #030d0b 100%);
    }
    .bg-fx .orb{ position:absolute; border-radius:50%; filter:blur(90px); opacity:.32; animation:float 18s ease-in-out infinite; }
    .bg-fx .orb.a{ width:420px; height:420px; background:#1f7d68; top:-90px; right:-60px; }
    .bg-fx .orb.b{ width:380px; height:380px; background:#c9962f; bottom:-120px; left:-80px; opacity:.18; animation-delay:-6s; }
    @keyframes float{ 0%,100%{ transform:translate3d(0,0,0) scale(1);} 50%{ transform:translate3d(0,-40px,0) scale(1.12);} }
    .bg-fx::after{
      content:""; position:absolute; inset:0;
      background-image:radial-gradient(rgba(255,255,255,.045) 1px, transparent 1px);
      background-size:3px 3px; opacity:.5;
    }
    @media (prefers-reduced-motion: reduce){ .bg-fx .orb{ animation:none; } }

    .lightbar{
      height:6px;
      background:radial-gradient(circle, var(--gold-soft) 38%, transparent 42%) 0 0 / 24px 24px repeat-x;
      filter:drop-shadow(0 0 6px rgba(231,183,64,.8));
      animation:twinkle 1.8s linear infinite;
    }
    @keyframes twinkle{
      0%,100%{ filter:drop-shadow(0 0 4px rgba(231,183,64,.6)); background-position-x:0; }
      50%{ filter:drop-shadow(0 0 12px rgba(231,183,64,1)); background-position-x:12px; }
    }
    @media (prefers-reduced-motion: reduce){ .lightbar{ animation:none; } }

    /* ---------- header ---------- */
    header{
      position:sticky; top:0; z-index:40;
      background:linear-gradient(180deg, rgba(13,51,45,.92), rgba(4,18,15,.82));
      backdrop-filter:blur(16px) saturate(140%);
      -webkit-backdrop-filter:blur(16px) saturate(140%);
      padding:12px 24px;
      display:flex; justify-content:space-between; align-items:center; gap:14px;
      border-bottom:1px solid var(--line);
      box-shadow:0 12px 40px rgba(0,0,0,.4);
      flex-wrap:wrap;
    }
    .head-brand{ display:flex; align-items:center; gap:12px; }
    .logo{ width:50px; height:50px; border-radius:16px; object-fit:cover;
      box-shadow:0 0 0 2px var(--gold), 0 8px 22px rgba(0,0,0,.45); }
    .head-brand b{
      font-family:'Cairo', sans-serif; font-weight:900; font-size:21px;
      background:linear-gradient(120deg, var(--gold-soft), var(--gold) 50%, #fff6dd 65%, var(--gold));
      background-size:200% auto;
      -webkit-background-clip:text; background-clip:text; color:transparent;
      animation:shineText 5s linear infinite;
    }
    @keyframes shineText{ to{ background-position:200% center; } }

    .return-page, .ghost-link{
      background:var(--glass);
      border:1px solid var(--line);
      border-radius:999px;
      padding:9px 18px;
      color:var(--ivory);
      font-family:'Cairo', sans-serif;
      font-weight:700; font-size:13.5px;
      text-decoration:none;
      display:inline-flex; align-items:center; gap:8px;
      cursor:pointer;
      backdrop-filter:blur(8px);
      transition:border-color .2s ease, transform .2s ease, background .2s ease;
    }
    .return-page i, .ghost-link i{ color:var(--gold); }
    .return-page:hover, .ghost-link:hover{ border-color:var(--line-strong); transform:translateY(-2px); background:rgba(231,183,64,.1); }
    .return-page a{ color:inherit; text-decoration:none; }

    /* ---------- page head ---------- */
    .page-head{ max-width:960px; margin:42px auto 26px; padding:0 22px; text-align:center; }
    .eyebrow-line{
      display:inline-flex; align-items:center; gap:10px;
      color:var(--gold);
      font-family:'Cairo', sans-serif;
      font-weight:800; font-size:12.5px; letter-spacing:2px;
      margin-bottom:8px;
    }
    .eyebrow-line::before, .eyebrow-line::after{
      content:""; width:34px; height:1px; background:linear-gradient(90deg, transparent, var(--gold));
    }
    .page-head h1{
      font-family:'Cairo', sans-serif;
      font-weight:900;
      font-size:clamp(28px, 4.4vw, 42px);
      margin:0 0 8px;
      background:linear-gradient(120deg, var(--gold) 0%, #fff3d0 45%, var(--gold) 70%);
      background-size:220% auto;
      -webkit-background-clip:text; background-clip:text; color:transparent;
      animation:shineText 4.5s linear infinite;
    }
    .page-head p{ color:var(--muted); margin:0; font-size:15px; }

    /* ---------- profile card ---------- */
    .wrap{ max-width:960px; margin:0 auto; padding:0 22px; }

    .user-card-full{
      display:flex;
      border:1px solid var(--line);
      border-radius:28px;
      overflow:hidden;
      background:linear-gradient(150deg, rgba(21,74,65,.5), rgba(6,24,20,.66));
      backdrop-filter:blur(14px);
      box-shadow:0 26px 64px rgba(0,0,0,.5);
      animation:riseIn .55s ease;
    }
    @keyframes riseIn{ from{ opacity:0; transform:translateY(22px);} to{ opacity:1; transform:none;} }

    .user-profile{
      position:relative;
      flex:0 0 300px;
      padding:34px 24px;
      text-align:center;
      background:linear-gradient(165deg, rgba(231,183,64,.2), rgba(255,107,77,.16) 55%, rgba(4,18,15,.4));
      border-left:1px solid var(--line);
      overflow:hidden;
    }
    .user-profile::before{
      content:"";
      position:absolute; top:-60px; left:-60px;
      width:220px; height:220px; border-radius:50%;
      background:radial-gradient(circle, rgba(231,183,64,.35), transparent 70%);
      filter:blur(18px);
    }
    .avatar-wrap{
      position:relative;
      width:130px; height:130px;
      margin:0 auto 18px;
      z-index:2;
    }
    .avatar-ring{
      position:relative;
      width:130px; height:130px;
      border-radius:50%;
      padding:4px;
      background:conic-gradient(from 0deg, var(--gold), #fff3d0, var(--coral), var(--gold));
      box-shadow:0 14px 34px rgba(0,0,0,.45);
      animation:spinRing 9s linear infinite;
    }
    @keyframes spinRing{ to{ transform:rotate(360deg); } }
    .avatar-ring img{
      width:100%; height:100%;
      border-radius:50%;
      object-fit:cover;
      background:#0b2b25;
      display:block;
      animation:spinRingRev 9s linear infinite;
    }
    @keyframes spinRingRev{ to{ transform:rotate(-360deg); } }
    @media (prefers-reduced-motion: reduce){
      .avatar-ring, .avatar-ring img{ animation:none; }
    }
    .edit-avatar{
      position:absolute;
      bottom:0; left:0;
      width:38px; height:38px;
      border-radius:50%;
      border:2px solid rgba(4,18,15,.7);
      background:linear-gradient(135deg, var(--gold-soft), var(--gold));
      color:var(--ink-deep);
      display:flex; align-items:center; justify-content:center;
      cursor:pointer;
      box-shadow:0 8px 20px rgba(231,183,64,.45);
      transition:transform .2s ease;
      z-index:3;
    }
    .edit-avatar:hover{ transform:scale(1.1); }

    .user-profile h2{
      position:relative;
      font-family:'Cairo', sans-serif;
      font-weight:900; font-size:23px;
      margin:0 0 6px;
      color:#fff;
      text-shadow:0 2px 14px rgba(0,0,0,.5);
    }
    .user-profile .role{
      position:relative;
      display:inline-flex; align-items:center; gap:7px;
      font-family:'Cairo', sans-serif;
      font-weight:800; font-size:12px;
      color:var(--ink-deep);
      background:linear-gradient(135deg, var(--gold-soft), var(--gold));
      border-radius:999px;
      padding:5px 14px;
      box-shadow:0 8px 20px rgba(231,183,64,.35);
    }

    .rank-note{
      position:relative;
      margin-top:22px;
      font-size:13px;
      color:rgba(255,255,255,.85);
      line-height:1.9;
    }

    /* ---------- info side ---------- */
    .card-block{ flex:1; padding:32px 30px; min-width:280px; }
    .block-title{
      font-family:'Cairo', sans-serif;
      font-weight:900; font-size:17px;
      margin:0 0 20px;
      padding-bottom:12px;
      border-bottom:1px solid var(--line);
      display:flex; align-items:center; gap:9px;
      color:var(--ivory);
    }
    .block-title i{ color:var(--gold); }

    .info-grid{
      display:grid;
      grid-template-columns:repeat(auto-fit, minmax(190px, 1fr));
      gap:14px;
      margin-bottom:28px;
    }
    .info-item{
      background:rgba(0,0,0,.2);
      border:1px solid rgba(255,255,255,.06);
      border-radius:16px;
      padding:14px 16px;
      text-align:right;
      transition:border-color .2s ease, transform .2s ease;
    }
    .info-item:hover{ border-color:var(--line); transform:translateY(-3px); }
    .info-item .label{
      display:flex; align-items:center; gap:7px;
      font-size:12px; font-weight:700;
      color:var(--muted);
      margin-bottom:6px;
    }
    .info-item .label i{ color:var(--gold); font-size:12px; }
    .info-item .val{
      font-family:'Cairo', sans-serif;
      font-weight:800; font-size:15.5px;
      color:var(--ivory);
      word-break:break-word;
      direction:ltr;
      text-align:right;
      unicode-bidi:plaintext;
    }

    /* ---------- stats ---------- */
    .stats-grid{
      display:grid;
      grid-template-columns:repeat(auto-fit, minmax(130px, 1fr));
      gap:14px;
      margin-bottom:26px;
    }
    .stat{
      position:relative;
      overflow:hidden;
      border-radius:18px;
      padding:18px 14px;
      text-align:center;
      border:1px solid var(--line);
      background:linear-gradient(160deg, rgba(231,183,64,.12), rgba(6,24,20,.5));
      transition:transform .22s ease, box-shadow .22s ease;
    }
    .stat:hover{ transform:translateY(-4px); box-shadow:0 16px 34px rgba(0,0,0,.4); }
    .stat i{
      font-size:18px; color:var(--gold);
      margin-bottom:8px; display:block;
    }
    .stat b{
      display:block;
      font-family:'Cairo', sans-serif;
      font-weight:900; font-size:26px;
      color:var(--gold);
      line-height:1.2;
    }
    .stat small{ color:var(--muted); font-size:12px; font-weight:700; }
    .stat.coral{ background:linear-gradient(160deg, rgba(255,107,77,.16), rgba(6,24,20,.5)); border-color:rgba(255,107,77,.3); }
    .stat.coral i, .stat.coral b{ color:var(--coral); }

    /* ---------- actions ---------- */
    .actions{ display:flex; gap:12px; flex-wrap:wrap; }
    .btn-gold, .btn-outline{
      display:inline-flex; align-items:center; gap:9px;
      font-family:'Cairo', sans-serif;
      font-weight:800; font-size:14.5px;
      border-radius:999px;
      padding:13px 26px;
      text-decoration:none;
      cursor:pointer;
      border:none;
      transition:transform .18s ease, box-shadow .18s ease, background .2s ease;
    }
    .btn-gold{
      background:linear-gradient(135deg, var(--gold-soft), var(--gold));
      color:var(--ink-deep);
      box-shadow:0 12px 28px rgba(231,183,64,.35);
    }
    .btn-gold:hover{ transform:translateY(-3px); box-shadow:0 18px 36px rgba(231,183,64,.5); }
    .btn-outline{
      background:transparent;
      border:1.5px solid rgba(255,107,77,.45);
      color:#ff9c89;
    }
    .btn-outline:hover{ background:rgba(255,107,77,.14); transform:translateY(-3px); }

    /* ---------- social ---------- */
    .social-link{
      list-style:none;
      display:flex; gap:12px;
      padding:0; margin:26px 0 0;
      flex-wrap:wrap;
    }
    .social-link a{
      width:44px; height:44px;
      border-radius:14px;
      display:flex; align-items:center; justify-content:center;
      background:rgba(0,0,0,.24);
      border:1px solid rgba(255,255,255,.07);
      color:var(--muted);
      font-size:17px;
      text-decoration:none;
      transition:all .22s ease;
    }
    .social-link a:hover{
      color:var(--ink-deep);
      background:linear-gradient(135deg, var(--gold-soft), var(--gold));
      border-color:var(--gold);
      transform:translateY(-4px);
      box-shadow:0 12px 26px rgba(231,183,64,.4);
    }

    /* ---------- toast ---------- */
    #toastBox{
      position:fixed; bottom:26px; left:50%;
      transform:translateX(-50%);
      z-index:999;
      display:flex; flex-direction:column; gap:10px; align-items:center;
      pointer-events:none;
    }
    .toast{
      background:linear-gradient(135deg, rgba(13,51,45,.97), rgba(4,18,15,.97));
      border:1px solid var(--line-strong);
      color:var(--ivory);
      font-family:'Cairo', sans-serif;
      font-weight:700; font-size:14.5px;
      padding:14px 22px;
      border-radius:14px;
      box-shadow:var(--shadow-lg);
      display:flex; align-items:center; gap:10px;
      animation:toastIn .3s ease;
    }
    .toast i{ color:var(--gold); }
    @keyframes toastIn{ from{ opacity:0; transform:translateY(18px);} to{ opacity:1; transform:none; } }
    .toast.out{ animation:toastOut .3s ease forwards; }
    @keyframes toastOut{ to{ opacity:0; transform:translateY(14px); } }

    @media (max-width: 820px){
      .user-card-full{ flex-direction:column; }
      .user-profile{ flex:none; border-left:none; border-bottom:1px solid var(--line); }
      .card-block{ padding:26px 20px; }
    }
  </style>

<script>
  function showToast(msg){
    const box = document.getElementById('toastBox');
    const t = document.createElement('div');
    t.className = 'toast';
    t.innerHTML = '<i class="fa-solid fa-circle-check"></i><span></span>';
    t.querySelector('span').textContent = msg;
    box.appendChild(t);
    setTimeout(() => { t.classList.add('out'); setTimeout(() => t.remove(), 320); }, 2400);
  }

  // صورة افتراضية مرسومة محلياً (بدون أي طلب خارجي)
  function defaultAvatar(name){
    const letter = (name || "؟").trim().charAt(0) || "؟";
    const svg = `<svg xmlns="http://www.w3.org/2000/svg" width="240" height="240" viewBox="0 0 240 240">
      <defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0%" stop-color="#154a41"/><stop offset="100%" stop-color="#0a2a24"/>
      </linearGradient></defs>
      <rect width="240" height="240" fill="url(#g)"/>
      <text x="120" y="120" fill="#e7b740" font-size="112" font-weight="bold"
            font-family="Cairo, Tahoma, sans-serif" text-anchor="middle"
            dominant-baseline="central">${letter}</text>
    </svg>`;
    return "data:image/svg+xml;charset=utf-8," + encodeURIComponent(svg);
  }

  function countUp(el, target){
    if (!el) return;
    if (!target || target <= 0){ el.textContent = 0; return; }
    let cur = 0;
    const step = Math.max(1, Math.ceil(target / 22));
    const timer = setInterval(() => {
      cur += step;
      if (cur >= target){ cur = target; clearInterval(timer); }
      el.textContent = cur;
    }, 35);
  }

  document.addEventListener("DOMContentLoaded", () => {
    const user = JSON.parse(localStorage.getItem("loggedInUser")) || {};
    const points  = parseInt(localStorage.getItem("points"))  || 0;
    const games   = (JSON.parse(localStorage.getItem("gameLog")) || []).length;

    const name = user.username || "زائر";
    document.getElementById("profileName").textContent = name;
    document.getElementById("infoUsername").textContent = name;
    document.getElementById("infoEmail").textContent = user.email || "غير مسجّل";
    document.getElementById("infoPhone").textContent = user.phone || "غير مسجّل";
    document.getElementById("infoJoined").textContent =
      user.joined || new Date().toLocaleDateString('ar-EG', { year:'numeric', month:'long', day:'numeric' });

    countUp(document.getElementById("statPoints"), points);
    countUp(document.getElementById("statGames"), games);

    // لقب اللاعب حسب عدد الألعاب
    let rank = "لاعب جديد";
    if (games >= 20) rank = "أسطورة جاوبني";
    else if (games >= 10) rank = "لاعب محترف";
    else if (games >= 3) rank = "لاعب نشِط";
    document.getElementById("profileRank").textContent = rank;

    document.getElementById("rankNote").textContent =
      points > 0
        ? `لديك ${points} نقطة — أنفقها على مساعدات إضافية من المتجر.`
        : "اجمع النقاط بالإجابات الصحيحة واشترِ بها مساعدات من المتجر.";

    // الصورة المحفوظة، أو صورة افتراضية بحرف الاسم
    const savedAvatar = localStorage.getItem("userAvatar");
    document.getElementById("avatarImg").src = savedAvatar || defaultAvatar(name);

    document.getElementById("avatarInput").addEventListener("change", (e) => {
      const file = e.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = (ev) => {
        document.getElementById("avatarImg").src = ev.target.result;
        try {
          localStorage.setItem("userAvatar", ev.target.result);
          showToast("تم تحديث صورة الحساب");
        } catch (err) {
          showToast("الصورة كبيرة جداً لحفظها — اختر صورة أصغر");
        }
      };
      reader.readAsDataURL(file);
    });
  });

  SFX.mountControls({ music: false });
  document.querySelectorAll('.btn-gold, .btn-outline, .return-page').forEach(el =>
    el.addEventListener('click', () => SFX.click()));

  function logoutUser(){
    localStorage.removeItem("loggedInUser");
    showToast("تم تسجيل الخروج بنجاح!");
    setTimeout(() => { window.location.href = "signIn.html"; }, 900);
  }
</script>

</body>
</html>
