<script>
  /* ---------------- helpers ---------------- */
  function showToast(msg){
    const box = document.getElementById('toastBox');
    const t = document.createElement('div');
    t.className = 'toast';
    t.innerHTML = '<i class="fa-solid fa-circle-check"></i><span></span>';
    t.querySelector('span').textContent = msg;
    box.appendChild(t);
    setTimeout(() => t.remove(), 2600);
  }

  const params   = new URLSearchParams(location.search);
  const category = params.get('category') || '';
  const points   = parseInt(params.get('points')) || 100;

  /* الفرق (٢ أو ٤ أو ٦) — teams.js */
  const TEAM_IDS = Teams.ids();
  const nameOf = (t) => Teams.name(t);
  let currentTurn = localStorage.getItem("currentTurn") || "team1";
  if (TEAM_IDS.indexOf(currentTurn) === -1) currentTurn = "team1";

  /* 🎡 سؤال العجلة الإضافي (wheel.js): فئة خارج الجولة، والنقاط = القيمة × المضاعف.
       milestone — للفريق الذي بلغ 1500 نقطة     tie — سؤال فاصل للفريقين عند التعادل
     لا يُعلَّم على اللوحة، ولا يغيّر الدور، ولا تعمل عليه المفاجآت. */
  const bonusMode = (params.get('bonus') === 'milestone' || params.get('bonus') === 'tie') ? params.get('bonus') : '';
  const mult = Math.max(1, Math.min(3, parseInt(params.get('mult'), 10) || 1));
  if (bonusMode === 'milestone' && TEAM_IDS.indexOf(params.get('team') || '') >= 0) currentTurn = params.get('team');
  /* السؤال الفاصل: الفرق المتعادلة وحدها تتنافس عليه */
  const TIED = (params.get('tied') || '').split(',').filter(t => TEAM_IDS.indexOf(t) >= 0);
  const CONTENDERS = (bonusMode === 'tie' && TIED.length > 1) ? TIED : TEAM_IDS;

  /* ترجمة نصوص سؤال العجلة عبر قاموس i18n ثم ملء قوالبها {team} {n}… */
  function trT(key, vars) {
    let s = (window.I18N && I18N.t) ? I18N.t(key) : key;
    Object.keys(vars || {}).forEach(k => { s = s.split('{' + k + '}').join(vars[k]); });
    return s;
  }

  /* مدة السؤال: 60 أو 80 أو 120 ثانية — تُضبط من صفحة الإعدادات */
  const QUESTION_SECONDS = (function () {
    const v = parseInt(localStorage.getItem("questionSeconds"), 10);
    return (v === 80 || v === 120) ? v : 60;
  })();
  let questionAudio = null;   // مشغّل الصوت الحالي (إن وُجد)
  let questionVideo = null;   // مشغّل الفيديو الحالي (إن وُجد)

  /* ---------------- fill header / meta ---------------- */
  document.getElementById("catBadge").textContent = category || "بدون فئة";
  document.getElementById("ptsBadge").textContent = points + " نقطة";
  /* أزرار «من أجاب إجابة صحيحة؟» — زر لكل فريق منافس */
  (function buildTeamButtons() {
    const box = document.getElementById("teamBtns");
    const none = document.getElementById("btnNone");
    box.classList.toggle("many", CONTENDERS.length > 2);
    CONTENDERS.forEach(t => {
      const b = document.createElement("button");
      b.className = "team-btn team";
      b.id = "btn-" + t;
      b.style.setProperty("--tc", Teams.color(t).main);
      b.onclick = () => award(t);
      b.innerHTML = '<i class="fa-solid fa-shield-halved"></i>' +
                    '<span class="nm" data-no-i18n></span><span class="mem" data-no-i18n></span>' +
                    '<span class="sc" id="score-' + t + '"></span>';
      b.querySelector(".nm").textContent = nameOf(t);
      /* أسماء اللاعبين تحت اسم الفريق */
      const mem = Teams.members(t);
      b.querySelector(".mem").textContent = mem.join('، ');
      b.querySelector(".mem").hidden = !mem.length;
      if (mem.length) b.title = nameOf(t) + ': ' + mem.join('، ');
      box.insertBefore(b, none);
    });
  })();

  /* إبراز زر الفريق صاحب الدور */
  function markTurn(team) {
    TEAM_IDS.forEach(t => {
      const b = document.getElementById("btn-" + t);
      if (b) b.classList.toggle("turn", t === team);
    });
  }

  document.getElementById("turnName").textContent = nameOf(currentTurn);
  markTurn(currentTurn);
  refreshScoreChips();

  /* شارة النقاط ونص الدور في سؤال العجلة — تُرسم الآن ثم تُعاد بعد تهيئة
     اللغة وعند تغييرها، لأن I18N يضبط اللغة عند DOMContentLoaded */
  function renderBonusMeta() {
    if (!bonusMode) return;
    document.getElementById("ptsBadge").textContent =
      '🎡 ' + points + ' × ' + mult + ' = ' + trT('{n} نقطة', { n: points * mult });
    if (bonusMode === 'tie') {
      /* السؤال الفاصل للمتعادلين معاً — لا دور ولا انتقال لفريق آخر */
      const names = CONTENDERS.map(nameOf);
      document.getElementById("turnName").textContent = names.length === 2
        ? trT('{a} و {b}', { a: names[0], b: names[1] })
        : names.join(' و ');
      document.getElementById("passBtn").hidden = true;
    }
  }
  renderBonusMeta();
  document.addEventListener("DOMContentLoaded", renderBonusMeta);
  document.addEventListener("i18n:change", renderBonusMeta);

  /* ---------------- load the question ---------------- */
  /* 1) سؤال هذه الجولة المُختار مسبقاً عشوائياً   2) وإلا اختيار عشوائي من المخزون */
  const round = JSON.parse(localStorage.getItem('roundQuestions') || '{}');
  let item = round[category + "_" + points] || null;

  /* الجولة تحفظ نسخة من السؤال لحظة بناء اللوحة، فأي تصحيح لاحق في البنك
     (صورة، صورة إجابة aimg، صياغة…) لا يصل إلى جولة جارية. نستبدلها بنسخة
     البنك الحالية للسؤال نفسه — نفس النص ونفس الإجابة — إن وُجدت. */
  if (item) {
    const fresh = ((window.questionsData || {})[category] || [])
      .find(x => x.q === item.q && x.a === item.a);
    if (fresh) item = fresh;
  }

  if (!item) {
    const pool = (window.questionsData || {})[category] || [];
    const level = { 100: 1, 200: 2, 300: 3, 400: 4, 500: 5, 600: 5 }[points] || 1;
    let pick = pool.filter(x => x.l === level);
    if (!pick.length) pick = pool;
    if (pick.length) item = pick[Math.floor(Math.random() * pick.length)];
  }

  /* فئة «ولا كلمة»: الكلمة تصل إلى الممثّل وحده عبر باركود يمسحه
     بجواله، فلا يراها بقية اللاعبين على الشاشة. والباركود يُبنى هنا من
     الجواب نفسه، فيكفي في بنك الأسئلة سطر فيه الكلمة — بلا رابط ولا
     صورة — وإضافة كلمة جديدة سطر واحد.
     ويأتي بعد المسار الاحتياطي أعلاه ليشمل الحالتين: سؤال الجولة
     المحفوظ، وسؤال يُختار من البنك حين تكون الجولة فارغة. */
  if (item && item.qr && !item.img) {
    item = Object.assign({}, item, {
      img: "https://api.qrserver.com/v1/create-qr-code/" +
           "?size=300x300&margin=10&ecc=M&format=png&data=" + encodeURIComponent(item.a)
    });
  }

  /* فئات صورتها للإجابة لا للسؤال: يُعرض السؤال نصاً بلا صورة (ولا صورة
     تُجلب له تلقائياً)، وتظهر صورته المكتوبة في البنك بعد إظهار الإجابة.
     في «الأنبياء والرسل» و«قصص الأنبياء» و«اسلامي» و«قرآن وسيرة»
     و«الحج والعمرة» كانت الصورة تُلمّح إلى الجواب قبل أن يجيب أحد. */
  const IMAGE_IN_ANSWER_CATEGORIES = ["الأنبياء والرسل", "قصص الأنبياء", "اسلامي", "قرآن وسيرة", "الحج والعمرة"];
  const imageInAnswer = IMAGE_IN_ANSWER_CATEGORIES.indexOf(category) >= 0;

  /* فئات الشعارات: الصورة على خلفية بيضاء (شعارات شفافة أو داكنة) */
  const LOGO_CATEGORIES = ["شعارات أندية", "شعارات كويتية"];
  const isLogoCategory = LOGO_CATEGORIES.indexOf(category) >= 0;

  /* بعض الشعارات ملفات صغيرة (أقل من 100 بكسل) فتظهر ضئيلة: نكبّر
     الطويل منها إلى ارتفاع مريح. العرض يتبع الارتفاع فتبقى النِّسب —
     وأقنعة hide — كما هي، ولا نكبّر العريض حتى لا يتجاوز عرض الشاشة. */
  function enlargeSmallLogo(img) {
    if (!isLogoCategory || !img) return;
    const fit = () => {
      const w = img.naturalWidth, h = img.naturalHeight;
      if (h && h < 180 && w / h < 1.5) img.style.height = "180px";
    };
    img.complete ? fit() : img.addEventListener("load", fit, { once: true });
  }

  /* قصّ الشعار (crop = [x, y, w, h] نِسباً مئوية): يُرسم رمز الشعار وحده
     على لوحة canvas بخلفية بيضاء، فلا تظهر أي كتابة في السؤال، ويُعرض
     الشعار كاملاً مع الإجابة. ?crop=1 يفصل هذا الطلب (CORS) عن نسخة
     الصورة العادية في ذاكرة المتصفح وعامل الخدمة. */
  /* pin اختياري: [س٪، ص٪] من الصورة الأصلية — تُرسم عليه حلقة حمراء داخل
     القصّة، فتعمل الخريطة المكبّرة كخريطة «ما اسم هذه المنطقة؟» */
  function cropImage(url, c, pin) {
    return new Promise((resolve, reject) => {
      const im = new Image();
      im.crossOrigin = "anonymous";
      im.onload = () => {
        try {
          const W = im.naturalWidth, H = im.naturalHeight;
          const sx = W * c[0] / 100, sy = H * c[1] / 100;
          const sw = W * c[2] / 100, sh = H * c[3] / 100;
          const k = Math.max(1, 320 / Math.max(sw, sh));
          const pad = Math.round(Math.max(sw, sh) * k * 0.06);
          const cv = document.createElement("canvas");
          cv.width  = Math.round(sw * k) + pad * 2;
          cv.height = Math.round(sh * k) + pad * 2;
          const g = cv.getContext("2d");
          g.fillStyle = "#fff";
          g.fillRect(0, 0, cv.width, cv.height);
          g.imageSmoothingQuality = "high";
          g.drawImage(im, sx, sy, sw, sh, pad, pad, sw * k, sh * k);

          /* حلقة على الموضع المطلوب داخل القصّة */
          if (pin && pin.length >= 2) {
            const px = pad + (pin[0] - c[0]) / c[2] * sw * k;
            const py = pad + (pin[1] - c[1]) / c[3] * sh * k;
            const r  = Math.max(10, Math.min(cv.width, cv.height) * 0.055);
            g.beginPath(); g.arc(px, py, r, 0, Math.PI * 2);
            g.lineWidth = Math.max(4, r * 0.32);
            g.strokeStyle = "rgba(255,255,255,.9)"; g.stroke();
            g.beginPath(); g.arc(px, py, r, 0, Math.PI * 2);
            g.lineWidth = Math.max(2.5, r * 0.2);
            g.strokeStyle = "#e23b2e"; g.stroke();
            g.beginPath(); g.arc(px, py, Math.max(2, r * 0.16), 0, Math.PI * 2);
            g.fillStyle = "#e23b2e"; g.fill();
          }
          resolve(cv.toDataURL("image/png"));
        } catch (e) { reject(e); }
      };
      im.onerror = reject;
      im.src = url + (url.indexOf("?") < 0 ? "?" : "&") + "crop=1";
    });
  }

  /* ---------------- ترجمة نص السؤال والإجابة ----------------
     الواجهة مترجمة يدوياً، أما نصوص الأسئلة فتُترجم آلياً حسب اللغة
     المختارة. النص العربي يظهر أولاً ثم يُستبدل بالترجمة عند وصولها،
     ويبقى الأصل معروضاً تحته للمقدّم. */
  /* اللغة تُقرأ عند الطلب لا عند تحميل السكربت:
     I18N.init() يعمل عند DOMContentLoaded، أي بعد تنفيذ هذا الملف. */
  function uiLangNow(){
    if (!window.I18N) return "ar";
    return I18N.get() !== "ar" ? I18N.get() : I18N.detect();
  }

  let shownQ = item ? item.q : "";
  let shownA = item ? item.a : "";

  function applyTranslation(){
    const uiLang = uiLangNow();
    if (!item || !window.Translate || uiLang === "ar") return;
    if (!Translate.enabled()) return;

    const qEl = document.getElementById("questionText");
    qEl.classList.add("translating");

    Translate.item(item, uiLang).then(tr => {
      qEl.classList.remove("translating");

      if (tr.q && tr.q !== item.q) {
        shownQ = tr.q;
        qEl.textContent = tr.q;
        addOriginal(qEl, item.q);
        markMachine();
      }
      if (tr.a && tr.a !== item.a) {
        shownA = tr.a;
        const aEl = document.getElementById("answerText");
        if (revealed) { aEl.textContent = tr.a; addOriginal(aEl, item.a); }
      }
    }).catch(() => qEl.classList.remove("translating"));
  }

  /* النص العربي الأصلي أسفل الترجمة — يفيد المقدّم عند تحكيم الإجابة */
  function addOriginal(el, text){
    if (el.querySelector(".orig")) return;
    const s = document.createElement("span");
    s.className = "orig";
    s.setAttribute("dir", "rtl");
    s.setAttribute("lang", "ar");
    s.textContent = text;
    el.appendChild(s);
  }

  /* الشارة تحمل اسم اللغة بلغتها — مفهومة بلا ترجمة */
  function markMachine(){
    const b = document.getElementById("mtBadge");
    if (!b) return;
    const meta = window.I18N ? I18N.meta(uiLangNow()) : null;
    b.querySelector(".lg").textContent = meta ? meta.native : "";
    b.hidden = false;
  }

  if (item) {
    document.getElementById("questionText").textContent = item.q;

    if (item.map) {
      const mb = document.getElementById("mapBadge");
      mb.hidden = false;
      mb.textContent = item.map;
    }

    renderMedia(item);
  } else {
    document.getElementById("questionText").innerHTML =
      '<span class="missing">لم يتم إضافة سؤال لهذه الفئة بقيمة ' + points + ' نقطة بعد.<br>' +
      'أضفه داخل ملف <code>questions.js</code> تحت الفئة <code>' + category + '</code>.<br>' +
      'تقدر تكمل يدوياً وتحتسب النقاط من الأسفل.</span>';
    document.getElementById("answerText").textContent = "—";
  }

  /* ---------------- الوسائط: صورة / صوت / فيديو / يوتيوب ---------------- */
  function fmt(t){
    if (!isFinite(t) || t < 0) t = 0;
    const m = Math.floor(t / 60), s = Math.floor(t % 60);
    return m + ":" + (s < 10 ? "0" : "") + s;
  }

  function ytId(v){
    if (!v) return "";
    const m = String(v).match(/(?:youtu\.be\/|v=|embed\/|shorts\/)([A-Za-z0-9_-]{6,})/);
    return m ? m[1] : String(v).trim();
  }

  function missingNote(path, kind){
    const d = document.createElement('div');
    d.className = 'media-missing';
    d.innerHTML = 'تعذّر تحميل ' + kind + ' الخاص بهذا السؤال.<br>ضع الملف في المسار: <code></code>';
    d.querySelector('code').textContent = path;
    return d;
  }

  function renderMedia(item){
    const media = document.getElementById("questionMedia");
    if (!item) return;
    media.hidden = false;

    /* صورة مقصوصة: شعار بلا كتابة، أو خريطة مكبّرة عليها حلقة (انظر cropImage) */
    if (item.crop && item.img && !item.streets && !item._cropped) {
      cropImage(item.img, item.crop, item.pin)
        /* الحلقة صارت مرسومة داخل الصورة، فلا نضيف حلقة الخريطة فوقها */
        .then(url => renderMedia(Object.assign({}, item, { img: url, _cropped: true, pin: null })))
        .catch(() => renderMedia(Object.assign({}, item, { _cropped: true })));
      return;
    }

    /* ---------- صورة السؤال ----------
       كل سؤال يحصل على صورة: إمّا الصورة المكتوبة له في بنك الأسئلة،
       وإمّا صورة يجلبها محرّك الصور تلقائياً (جوجل / ويكيبيديا / كومنز…).
       وإن تعذّر كل ذلك تُعرض بطاقة مولّدة داخل المتصفح فلا يبقى سؤال بلا صورة. */
    /* أسئلة «استمع وخمّن» بلا صورة مكتوبة: لا نجلب لها صورة تلقائياً،
       لأن الصورة تكشف الإجابة (آلة موسيقية، سورة، قارئ…). المقطع الصوتي
       هو وسيط السؤال. أمّا لو كُتبت لها صورة محايدة فهي تُعرض كالمعتاد. */
    /* أسئلة الوسائط (صوت أو فيديو) بلا صورة مكتوبة: لا نجلب لها صورة تلقائياً —
       الوسيط نفسه هو السؤال، وأي صورة إضافية إما تكشف الإجابة أو تشوّش. */
    const audioOnly = (!!item.audio || !!item.yt || !!item.video) && !item.img;
    /* فئة صورتها للإجابة: لا صورة في السؤال — وإن لم يكن فيه وسيط آخر
       نخفي حاوية الوسائط كلها فلا يبقى مكانها فارغاً */
    const noQuestionImage = audioOnly || imageInAnswer;
    if (imageInAnswer && !item.audio && !item.yt && !item.video) media.hidden = true;

    const shell = document.createElement('div');
    shell.className = 'q-img-shell';
    if (!noQuestionImage) media.appendChild(shell);

    /* تنسيق الصورة حسب نوعها كما كان سابقاً */
    let cls = '';
    if (item.img) {
      if (isLogoCategory)                  cls = 'logoimg';
      else if (/icons?\//i.test(item.img)) cls = 'iconimg';
      else if (/flag/i.test(item.img))     cls = 'flagimg';
      else if (/maps?\//i.test(item.img))  cls = 'mapimg';
    }

    if (noQuestionImage) {
      /* لا صورة — يكتفي السؤال بالمشغّل الصوتي، أو صورته تنتظر الإجابة */
    } else if (item.streets) {
      /* خريطة شوارع المنطقة: شبكة بلاطات حول الإحداثيات، والحلقة في المنتصف.
         streets = [خط العرض، خط الطول، درجة التقريب] */
      const box = document.createElement('div');
      box.className = 'worldpin streetmap';

      const lat = item.streets[0], lon = item.streets[1], z = item.streets[2] || 13;
      const n = Math.pow(2, z);
      const xf = (lon + 180) / 360 * n;
      const r  = lat * Math.PI / 180;
      const yf = (1 - Math.log(Math.tan(r) + 1 / Math.cos(r)) / Math.PI) / 2 * n;
      const x0 = Math.floor(xf), y0 = Math.floor(yf);
      const px = (xf - x0) * 256, py = (yf - y0) * 256;

      /* طبقة بلاطات: ٥×٥ بلاطة (٢٥٦ بكسل) — تكفي النافذة العادية ونافذة
         التكبير بلا فراغ في الحواف — مُزاحة حتى تقع المنطقة في المنتصف. */
      function tileLayer(service, cls) {
        const layer = document.createElement('div');
        layer.className = 'tiles' + (cls ? ' ' + cls : '');
        layer.style.left = '50%';
        layer.style.top  = '50%';
        layer.style.marginLeft = -(512 + px) + 'px';
        layer.style.marginTop  = -(512 + py) + 'px';

        for (let dy = -2; dy <= 2; dy++) {
          for (let dx = -2; dx <= 2; dx++) {
            const t = document.createElement('img');
            t.alt = '';
            t.loading = 'eager';
            t.style.left = ((dx + 2) * 256) + 'px';
            t.style.top  = ((dy + 2) * 256) + 'px';
            t.src = 'https://services.arcgisonline.com/ArcGIS/rest/services/' + service +
                    '/MapServer/tile/' + z + '/' + (y0 + dy) + '/' + (x0 + dx);
            layer.appendChild(t);
          }
        }
        return layer;
      }

      /* الأساس: شوارع وأحياء وحدائق بلا أي كتابة */
      box.appendChild(tileLayer('Canvas/World_Light_Gray_Base'));
      /* وفوقه أسماء الشوارع والطرق وحدها — طبقة «النقل» لا تحمل أسماء
         المناطق، فتظهر أسماء الشوارع ويبقى اسم المنطقة مخفياً. */
      box.appendChild(tileLayer('Reference/World_Transportation', 'labels'));

      const ring = document.createElement('span');
      ring.className = 'wp-ring';
      box.appendChild(ring);

      shell.appendChild(box);

      const credit = document.createElement('span');
      credit.className = 'map-credit';
      credit.setAttribute('data-no-i18n', '');
      credit.textContent = 'Esri, HERE, Garmin, © OpenStreetMap contributors';
      shell.appendChild(credit);

    } else if (item.pin) {
      /* فئة الخرائط: خريطة العالم كاملة مع حلقة على الدولة المقصودة،
         وشكل الدولة الصمّاء في الزاوية لإزالة اللبس بين الجارات. */
      const box = document.createElement('div');
      box.className = 'worldpin';

      const map = document.createElement('img');
      map.className = 'wp-map';
      map.src = item.img;
      map.alt = 'خريطة العالم';
      map.onerror = () => { box.replaceWith(missingNote(item.img, 'خريطة')); };
      box.appendChild(map);

      const ring = document.createElement('span');
      ring.className = 'wp-ring';
      ring.style.insetInlineStart = '';
      ring.style.left = item.pin[0] + '%';
      ring.style.top  = item.pin[1] + '%';
      box.appendChild(ring);

      if (item.shape) {
        const sh = document.createElement('img');
        sh.className = 'wp-shape';
        sh.src = item.shape;
        sh.alt = 'شكل الدولة';
        sh.onerror = () => sh.remove();
        box.appendChild(sh);
      }

      shell.appendChild(box);
    } else if (window.Images) {
      shell.classList.add('loading');
      Images.mountInto(shell, item, category, { className: cls })
        .then(() => { shell.classList.remove('loading'); enlargeSmallLogo(shell.querySelector('img')); applyHideMasks(shell, item.hide); applyLabels(shell, item.labels); })
        .catch(() => shell.classList.remove('loading'));
    } else if (item.img) {
      const im = document.createElement('img');
      im.src = item.img;
      im.alt = "صورة السؤال";
      im.className = cls;
      im.onerror = () => { im.replaceWith(missingNote(item.img, 'صورة')); };
      shell.appendChild(im);
      applyHideMasks(shell, item.hide);
      applyLabels(shell, item.labels);
    }

    /* صوت — مشغّل مخصص */
    if (item.audio) {
      const wrap = document.createElement('div');
      wrap.className = 'aud';
      wrap.innerHTML =
        '<button class="play" type="button" title="تشغيل"><i class="fa-solid fa-play"></i></button>' +
        '<div class="body">' +
          '<div class="label"><span class="eq idle"><span></span><span></span><span></span><span></span></span>' +
          '<span>المقطع الصوتي</span></div>' +
          '<div class="bar"><div class="fill"></div></div>' +
          '<div class="time"><span class="cur">0:00</span><span class="dur">0:00</span></div>' +
        '</div>';
      media.appendChild(wrap);

      const au   = new Audio(item.audio);
      au.preload = "metadata";
      const btn  = wrap.querySelector('.play');
      const icon = btn.querySelector('i');
      const bar  = wrap.querySelector('.bar');
      const fill = wrap.querySelector('.fill');
      const eq   = wrap.querySelector('.eq');
      const cur  = wrap.querySelector('.cur');
      const dur  = wrap.querySelector('.dur');

      /* مقطع جزئي اختياري: t0 بداية التشغيل، t1 نهايته (بالثواني) */
      const t0 = Number(item.t0) || 0;
      const t1 = (item.t1 != null) ? Number(item.t1) : Infinity;
      const clipEnd = () => Math.min(t1, au.duration || t1);
      const clipDur = () => Math.max(0, clipEnd() - t0);
      const clipCur = () => Math.max(0, Math.min(au.currentTime, clipEnd()) - t0);

      au.addEventListener('loadedmetadata', () => {
        dur.textContent = fmt(clipDur());
        if (t0) au.currentTime = t0;
      });
      au.addEventListener('timeupdate', () => {
        if (au.currentTime >= clipEnd() - 0.05 && isFinite(t1)) {
          if (!au.paused) au.pause();
          cur.textContent = fmt(clipDur());
          fill.style.width = '100%';
          icon.className = 'fa-solid fa-rotate-right';
          eq.classList.add('idle');
          return;
        }
        cur.textContent = fmt(clipCur());
        const d = clipDur();
        if (d) fill.style.width = (clipCur() / d * 100) + '%';
      });
      au.addEventListener('ended', () => {
        icon.className = 'fa-solid fa-rotate-right';
        eq.classList.add('idle');
      });
      au.addEventListener('error', () => {
        wrap.replaceWith(missingNote(item.audio, 'المقطع الصوتي'));
      });

      btn.addEventListener('click', () => {
        if (au.paused) {
          if (au.currentTime < t0 - 0.05 || au.currentTime >= clipEnd() - 0.05) au.currentTime = t0;
          au.play().catch(() => {});
          icon.className = 'fa-solid fa-pause';
          eq.classList.remove('idle');
        } else {
          au.pause();
          icon.className = 'fa-solid fa-play';
          eq.classList.add('idle');
        }
      });
      bar.addEventListener('click', (e) => {
        if (!au.duration) return;
        const r = bar.getBoundingClientRect();
        au.currentTime = t0 + ((r.right - e.clientX) / r.width) * clipDur();
      });

      questionAudio = au;
    }

    /* فيديو محلي أو رابط مباشر */
    if (item.video) {
      const box = document.createElement('div');
      box.className = 'vid' + (item.bw ? ' bw' : '');
      const v = document.createElement('video');
      v.src = item.video;
      v.controls = true;
      v.playsInline = true;
      v.preload = "metadata";
      v.onerror = () => { box.replaceWith(missingNote(item.video, 'مقطع الفيديو')); };
      box.appendChild(v);
      media.appendChild(box);
      questionVideo = v;
    }

    /* فيديو يوتيوب */
    if (item.yt) {
      const box = document.createElement('div');
      box.className = 'vid' + (item.bw ? ' bw' : '');
      const fr = document.createElement('iframe');
      /* ys/ye: مقطع محدّد من الفيديو بالثواني (مثلاً 30 ثانية حول الهدف) —
         يوتيوب يبدأ من ys ويتوقّف عند ye */
      const range = (item.ys != null ? "&start=" + Math.floor(item.ys) : "") +
                    (item.ye != null ? "&end=" + Math.floor(item.ye) : "");
      /* يوتيوب يرفض التشغيل المضمَّن (الخطأ 153) إن لم تُرسل الصفحة عنوانها
         (Referer) — فنطلبه صراحة */
      fr.referrerPolicy = "strict-origin-when-cross-origin";
      fr.src = "https://www.youtube-nocookie.com/embed/" + ytId(item.yt) + "?rel=0&modestbranding=1" + range;
      /* اللعبة مفتوحة كملف من الجهاز (file://): لا عنوان يُرسل فيرفض يوتيوب
         التشغيل (الخطأ 153) — فنمرّ عبر وسيط على موقع اللعبة (yt.html) يضمّن
         يوتيوب بعنوان الموقع فيعمل المقطع */
      if (location.protocol === "file:") {
        fr.src = "https://aed60907080-crypto.github.io/jawabni-game/yt.html?v=" +
                 encodeURIComponent(ytId(item.yt)) +
                 (item.ys != null ? "&s=" + Math.floor(item.ys) : "") +
                 (item.ye != null ? "&e=" + Math.floor(item.ye) : "");
      }
      fr.allow = "accelerometer; encrypted-media; picture-in-picture";
      fr.allowFullscreen = true;
      fr.title = "مقطع السؤال";
      box.appendChild(fr);

      /* تغطية عنوان الفيديو — انظر .vid-mask في التنسيق أعلاه.
         hide = [[x, y, w, h], …] نسبةً مئوية من مساحة المشغّل. */
      if (Array.isArray(item.hide)) {
        item.hide.forEach(r => {
          if (!Array.isArray(r) || r.length < 4) return;
          const mask = document.createElement("i");
          mask.className = "vid-mask";
          mask.style.cssText =
            "left:" + r[0] + "%;top:" + r[1] + "%;width:" + r[2] + "%;height:" + r[3] + "%;";
          box.appendChild(mask);
        });
      }

      media.appendChild(box);

      /* زر «شغّل المقطع»: يفتح المقطع نفسه (من ys إلى ye) في نافذة جديدة —
         للمتصفحات التي تمنع المشغّل المضمَّن (مثل المتصفح داخل تطبيق Claude:
         يظهر المربع أسود). الصفحة تُفتح من رابط في اللعبة فيصل يوتيوب عنوانها
         ويعمل المشغّل؛ أما اللعبة المفتوحة كملف فلا عنوان لها، فنفتح
         المقطع عبر yt.html على موقع اللعبة، فينتقل إلى المشغّل بعنوان الموقع. */
      {
        const id = encodeURIComponent(ytId(item.yt));
        const btn = document.createElement("a");
        btn.className = "yt-open";
        btn.target = "_blank";
        btn.rel = "noopener";                      /* بلا noreferrer: يوتيوب يحتاج العنوان */
        btn.referrerPolicy = "strict-origin-when-cross-origin";
        btn.href = location.protocol === "file:"
          ? "https://aed60907080-crypto.github.io/jawabni-game/yt.html?go=1&v=" + id +
            (item.ys != null ? "&s=" + Math.floor(item.ys) : "") +
            (item.ye != null ? "&e=" + Math.floor(item.ye) : "")
          : "https://www.youtube-nocookie.com/embed/" + id + "?rel=0&modestbranding=1&autoplay=1" + range;
        btn.innerHTML = '<i class="fa-solid fa-play"></i> شغّل المقطع' +
          (item.ye != null && item.ys != null ? ' <small>(' + Math.round(item.ye - item.ys) + ' ثانية)</small>' : '');
        btn.addEventListener("click", () => { if (window.SFX) SFX.click(); });
        const row = document.createElement("div");
        row.className = "yt-open-row";
        row.appendChild(btn);
        const hint = document.createElement("small");
        hint.className = "yt-note";
        hint.textContent = "إن ظهر المربع أسود، شغّل المقطع من الزر";
        row.appendChild(hint);
        media.appendChild(row);
      }
    }
  }

  /* ---------------- timer ---------------- */
  const ring = document.getElementById("progRing");
  const R = 58;
  const CIRC = 2 * Math.PI * R;
  ring.style.strokeDasharray = CIRC;
  ring.style.strokeDashoffset = 0;

  let left = QUESTION_SECONDS;
  let timerTotal = QUESTION_SECONDS;   /* يصير ٣٠ في وقت الفريق الآخر — لحساب الحلقة */
  let paused = false;
  let revealed = false;
  let ticker = null;

  /* ⏱ شكل الساعة: حلقة (الافتراضي) أو قرص أو شريط أو رقمية — يُحفظ للأسئلة القادمة */
  const TIMER_STYLES = ["ring", "pie", "bar", "digital"];
  const TIMER_STYLE_NAMES = { ring: "حلقة", pie: "قرص", bar: "شريط", digital: "رقمية" };
  const timerBox = document.getElementById("timerBox");
  function setTimerStyle(s){
    if (TIMER_STYLES.indexOf(s) < 0) s = "ring";
    timerBox.dataset.style = s;
    try { localStorage.setItem("timerStyle", s); } catch (e) {}
  }
  setTimerStyle((function(){ try { return localStorage.getItem("timerStyle"); } catch (e) { return null; } })());
  document.getElementById("timerStyleBtn").addEventListener("click", () => {
    const i = TIMER_STYLES.indexOf(timerBox.dataset.style);
    const next = TIMER_STYLES[(i + 1) % TIMER_STYLES.length];
    setTimerStyle(next);
    renderTimer();
    if (window.SFX) SFX.click();
    showToast("شكل الساعة: " + TIMER_STYLE_NAMES[next]);
  });

  function renderTimer(){
    /* الرقمية تكتب الوقت بدقائق وثوانٍ 0:45 */
    document.getElementById("timeLeft").textContent = timerBox.dataset.style === "digital"
      ? Math.floor(left / 60) + ":" + String(left % 60).padStart(2, "0")
      : left;
    timerBox.style.setProperty("--p", Math.max(0, left / timerTotal));
    ring.style.strokeDashoffset = CIRC * (1 - left / timerTotal);
    document.body.classList.toggle("hurry", left <= 10 && left > 0 && !revealed);
    if (left <= 10 && !revealed) ring.style.stroke = "#ff6b4d";
  }
  renderTimer();

  function startTimer(){
    clearInterval(ticker);
    ticker = setInterval(() => {
      if (paused || revealed) return;
      left--;
      if (left <= 0){
        left = 0;
        renderTimer();
        SFX.timeUp();
        /* انتهى وقت الفريق الأول — للفريق الآخر ٣٠ ثانية قبل كشف الإجابة */
        if (startOtherTeamTime(true)) return;
        clearInterval(ticker);
        revealAnswer(true);
        return;
      }
      if (left <= 10) SFX.tick(left <= 5);
      renderTimer();
    }, 1000);
  }
  startTimer();

  function togglePause(){
    SFX.click();
    paused = !paused;
    const btn = document.getElementById("pauseBtn");
    btn.innerHTML = paused
      ? '<i class="fa-solid fa-play"></i> متابعة المؤقّت'
      : '<i class="fa-solid fa-pause"></i> إيقاف المؤقّت';
  }

  /* 🔄 إعادة الوقت: يرجع العدّاد إلى بدايته — مدة السؤال كاملة، أو وقت
     الفريق الآخر كاملاً إن كان السؤال انتقل إليه — ويستأنف إن كان موقوفاً */
  function resetTimer(){
    if (revealed) return;
    SFX.click();
    left = timerTotal;
    ring.style.stroke = '';
    if (paused) {
      paused = false;
      document.getElementById("pauseBtn").innerHTML = '<i class="fa-solid fa-pause"></i> إيقاف المؤقّت';
    }
    renderTimer();
    showToast('🔄 أُعيد الوقت: ' + timerTotal + ' ثانية');
  }

  /* ⏱️ وقت الفريق الآخر — حين ينتهي الوقت (أو يضغط المقدّم الزر لأن الفريق
     أخطأ) ينتقل السؤال للفريق الآخر بثلاثين ثانية، ثم تُكشف الإجابة إن لم
     يجب. مرة واحدة لكل سؤال، ولا تحدث إن كان الآخر ممنوعاً بـ«امنع الخصم». */
  /* المدة من الإعدادات: ٣٠ (الافتراضي) أو ٦٠ أو ٨٠ ثانية */
  const OTHER_TEAM_SECONDS = (function () {
    const v = parseInt(localStorage.getItem("otherTeamSeconds"), 10);
    return (v === 60 || v === 80) ? v : 30;
  })();
  document.getElementById('passSecs').textContent = OTHER_TEAM_SECONDS;
  /* الفرق التي أخذت فرصتها في هذا السؤال — مع أكثر من فريقين ينتقل السؤال
     للفريق التالي في الدور، ثم الذي يليه، حتى تجرّبه كل الفرق */
  const triedTeams = [];

  /* الفريق التالي الذي لم يجرّب السؤال ولم يُمنع منه — أو null */
  function nextCandidate(){
    const tried = triedTeams.concat([answeringTeam]);
    return Teams.others(answeringTeam).find(t => tried.indexOf(t) === -1 && t !== blockedTeam) || null;
  }

  function startOtherTeamTime(auto){
    if (revealed || bonusMode === 'tie') return false;
    const nm = nameOf;
    const other = nextCandidate();

    if (!other) {
      /* فريقان: الخصم ممنوع بـ«امنع الخصم» — نفس رسالة النسخة السابقة */
      const rival = Teams.others(answeringTeam).find(t => triedTeams.indexOf(t) === -1);
      if (!auto && rival && rival === blockedTeam) showToast('🚫 ' + nm(rival) + ' ممنوع من الإجابة على هذا السؤال');
      return false;
    }

    const was = answeringTeam;
    triedTeams.push(was);
    answeringTeam = other;
    document.getElementById("turnName").textContent = nm(other);
    markTurn(other);

    left = OTHER_TEAM_SECONDS;
    timerTotal = OTHER_TEAM_SECONDS;
    ring.style.stroke = '';                       /* يعود ذهبياً بعد أحمر آخر عشر ثوانٍ */
    if (paused) {
      paused = false;
      document.getElementById("pauseBtn").innerHTML = '<i class="fa-solid fa-pause"></i> إيقاف المؤقّت';
    }
    renderTimer();
    /* يبقى الزر ما دام هناك فريق لم يجرّب السؤال */
    document.getElementById('passBtn').hidden = !nextCandidate();
    if (typeof renderHelps === 'function') renderHelps();   /* مساعدات الفريق الآخر */

    if (window.SFX) SFX.turn();
    showToast('⏱️ ' + (auto ? 'انتهى وقت ' + nm(was) : nm(was) + ' لم يُصب') +
              ' — ' + nm(other) + ' عنده ' + OTHER_TEAM_SECONDS + ' ثانية');
    return true;
  }

  /* ================= المفاجآت ================= */
  /* الفريق الذي يجيب — قد يتغيّر بمساعدة «اسرق الدور» */
  let answeringTeam = currentTurn;

  /* تُكشف المفاجأة قبل الإجابة، ولا يُطبَّق أثرها إلا عند إجابة صحيحة.
     العقوبات تقع على الفريق الذي **لم** يجب، والمكافآت للفريق الذي أجاب.
     إن اختار المقدّم «لا أحد» فلا يحدث شيء إطلاقاً. */
  const surprise = window.Powerups ? Powerups.reveal(category, points) : null;

  if (surprise && surprise.def) {
    const box = document.getElementById('surpriseBox');
    box.hidden = false;
    box.classList.toggle('bad', surprise.def.tone === 'bad');
    document.getElementById('surpriseEmoji').textContent = surprise.def.emoji;
    document.getElementById('surpriseName').textContent  = surprise.def.name + '!';
    document.getElementById('surpriseDesc').textContent  =
      'عند الإجابة الصحيحة: ' + surprise.outcome;

    if (window.SFX) surprise.def.tone === 'bad' ? SFX.penalty() : SFX.coin();
  }

  /* ================= المساعدات ================= */
  function renderHelps(){
    if (!window.Powerups) { document.getElementById('helpsBox').hidden = true; return; }

    document.getElementById('helpsTeam').textContent = nameOf(answeringTeam);

    const row = document.getElementById('helpsRow');
    row.innerHTML = '';

    const inv = Powerups.helpInventory(answeringTeam);

    Powerups.HELPS.forEach(def => {
      /* مساعدات المتجر لا تظهر إلا لمن اشتراها */
      if (!Powerups.isOffered(def.key)) return;
      const left = inv[def.key] || 0;
      const can  = left > 0 && !revealed;

      const b = document.createElement('button');
      b.type = 'button';
      b.className = 'help-btn';
      b.disabled = !can;
      b.title = def.desc;
      /* العدد يظهر حين يملك الفريق أكثر من واحدة (بالشراء بالنقاط) */
      b.innerHTML = '<span class="em">' + def.emoji + '</span><span class="nm"></span>' +
                    (left > 1 ? '<span class="n">' + left + '</span>' : '');
      b.querySelector('.nm').textContent = def.name;
      b.onclick = () => useHelp(def.key);
      row.appendChild(b);
    });

    if (window.I18N) I18N.apply(document.getElementById('helpsBox'));
  }

  /* مساعدات تقع على فريق آخر: مع فريقين هو الخصم مباشرة، ومع ٤ أو ٦ فرق
     يختار المقدّم الفريق المستهدف من نافذة صغيرة */
  const TARGETED_HELPS = { steal: 'من يجيب بدلاً منكم؟', stealPts: 'اسرق النقاط من أي فريق؟',
                           freezeOpp: 'جمّد دور أي فريق؟', block: 'امنع أي فريق من نقاط السؤال؟',
                           cutPts: 'خفّض نقاط أي فريق؟' };

  function useHelp(key){
    if (!TARGETED_HELPS[key] || TEAM_IDS.length <= 2) {
      applyHelp(key, Teams.others(answeringTeam)[0]);
      return;
    }
    pickTeam(TARGETED_HELPS[key], Teams.others(answeringTeam)).then(t => { if (t) applyHelp(key, t); });
  }

  /* نافذة اختيار فريق — تعيد Promise بمعرّف الفريق أو null عند الإلغاء */
  function pickTeam(title, candidates){
    return new Promise(resolve => {
      const ov = document.createElement('div');
      ov.className = 'pick-team';
      ov.innerHTML = '<div class="pt-card"><h5></h5><div class="pt-list"></div>' +
                     '<button type="button" class="pt-cancel">إلغاء</button></div>';
      ov.querySelector('h5').textContent = title;
      const s = Teams.scores();
      const done = (v) => { ov.remove(); resolve(v); };
      candidates.forEach(t => {
        const b = document.createElement('button');
        b.type = 'button';
        b.className = 'pt-btn';
        b.style.setProperty('--tc', Teams.color(t).main);
        b.innerHTML = '<span data-no-i18n></span><small></small>';
        b.querySelector('span').textContent = nameOf(t);
        b.querySelector('small').textContent = s[t] + ' نقطة';
        b.onclick = () => done(t);
        ov.querySelector('.pt-list').appendChild(b);
      });
      ov.querySelector('.pt-cancel').onclick = () => done(null);
      ov.addEventListener('click', e => { if (e.target === ov) done(null); });
      document.body.appendChild(ov);
      if (window.I18N) I18N.apply(ov);
    });
  }

  function applyHelp(key, other){
    /* فحوص قبل الاستهلاك — حتى لا تضيع المساعدة بلا أثر */
    if ((key === 'stealPts' || key === 'cutPts') && Powerups.teamScore(other) <= 0) {
      showToast('رصيد ' + teamNameOf(other) + ' صفر — لا نقاط لسحبها أو خصمها');
      return;
    }
    if (key === 'steal' && blockedTeam === other) {
      showToast('🚫 ' + teamNameOf(other) + ' ممنوع من الإجابة — لا يمكن تحويل الدور إليه');
      return;
    }

    if (!Powerups.useHelp(answeringTeam, key)) return;
    if (window.SFX) SFX.click();

    if (key === 'two')       helpTwoAnswers();
    if (key === 'call')      helpCall();
    if (key === 'steal')     helpSteal(other);
    if (key === 'stealPts')  helpStealPoints(other);
    if (key === 'freezeOpp') helpFreezeOpponent(other);
    if (key === 'block')     helpBlock(other);
    if (key === 'search')    helpSearch();
    if (key === 'cutPts')    helpCutPoints(other);

    renderHelps();
  }

  /* 🅰️ جوابين — الإجابة الصحيحة مع إجابة مضلّلة من نفس المستوى */
  function helpTwoAnswers(){
    if (!item) return;
    const decoy = Powerups.decoyFor(item, category);
    /* نعرض الإجابة المترجمة إن توفّرت حتى لا تختلط اللغتان */
    const opts = decoy ? [shownA, decoy] : [shownA];
    /* الخيار المضلّل يُترجم أيضاً */
    const uiLang = uiLangNow();
    if (decoy && window.Translate && uiLang !== "ar") {
      Translate.text(decoy, uiLang).then(t => {
        if (!t || t === decoy) return;
        const nodes = document.querySelectorAll("#twoAnswersOpts .ta-opt");
        nodes.forEach(n => { if (n.textContent === decoy) n.textContent = t; });
      });
    }

    /* خلط الخيارين حتى لا يُعرف موضع الصحيح */
    for (let i = opts.length - 1; i > 0; i--){
      const j = Math.floor(Math.random() * (i + 1));
      [opts[i], opts[j]] = [opts[j], opts[i]];
    }

    const box = document.getElementById('twoAnswers');
    const wrap = document.getElementById('twoAnswersOpts');
    wrap.innerHTML = '';
    opts.forEach(o => {
      const d = document.createElement('div');
      d.className = 'ta-opt';
      d.textContent = o;
      wrap.appendChild(d);
    });
    box.hidden = false;
    box.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
  }

  /* 📞 مكالمة — ٣٠ ثانية والمؤقّت الأساسي متوقف */
  function helpCall(){
    timedPause({
      emoji: '📞', title: 'مكالمة صديق',
      note: 'مؤقّت السؤال متوقف أثناء المكالمة',
      end: '<i class="fa-solid fa-phone-slash"></i> إنهاء المكالمة'
    });
  }

  /* نافذة ٣٠ ثانية يتوقف فيها مؤقّت السؤال — تشترك فيها «مكالمة» و«البحث» */
  function timedPause(o){
    const wasPaused = paused;
    paused = true;

    const ov = document.getElementById('callOverlay');
    const num = document.getElementById('callNum');
    ov.querySelector('.ring').textContent = o.emoji;
    ov.querySelector('h3').textContent = o.title;
    ov.querySelector('p').textContent = o.note;
    document.getElementById('callEnd').innerHTML = o.end;
    let secs = 30;
    num.textContent = secs;
    ov.classList.add('on');

    const iv = setInterval(() => {
      secs--;
      num.textContent = Math.max(0, secs);
      if (secs <= 5 && secs > 0 && window.SFX) SFX.tick(true);
      if (secs <= 0) endCall();
    }, 1000);

    function endCall(){
      clearInterval(iv);
      ov.classList.remove('on');
      paused = wasPaused;
      if (window.SFX) SFX.timeUp();
    }
    document.getElementById('callEnd').onclick = endCall;
  }

  /* 🔀 اسرق الدور — الفريق الآخر يجيب على هذا السؤال */
  function helpSteal(other){
    answeringTeam = other || Teams.next(answeringTeam);
    const who = nameOf(answeringTeam);
    document.getElementById("turnName").textContent = who;
    markTurn(answeringTeam);
    document.getElementById('passBtn').hidden = !nextCandidate() || bonusMode === 'tie';
    if (window.SFX) SFX.stealTurn();
    showToast('🔀 سُرق الدور — ' + who + ' هو من يجيب الآن');
  }

  /* ---------- مساعدات المتجر ---------- */
  const teamNameOf = nameOf;

  /* الفريق الممنوع من أخذ نقاط هذا السؤال (مساعدة «امنع الخصم») */
  let blockedTeam = null;

  function refreshScoreChips(){
    const s = Teams.scores();
    TEAM_IDS.forEach(t => {
      const el = document.getElementById("score-" + t);
      if (el) el.textContent = s[t] + " نقطة";
    });
  }

  /* 💰 اسرق النقاط — تنتقل قيمة السؤال من الخصم إليك فوراً (مرة واحدة في الجولة) */
  function helpStealPoints(other){
    const n = Powerups.transferPoints(other, answeringTeam, Number(points) || 0);
    refreshScoreChips();
    if (window.SFX) SFX.coin();
    showToast('💰 ' + teamNameOf(answeringTeam) + ' سحب ' + n + ' نقطة من ' + teamNameOf(other));
  }

  /* ❄️ جمّد دور الخصم — يفقد دوره القادم */
  function helpFreezeOpponent(other){
    Powerups.freeze(other, 1);
    if (window.SFX) SFX.penalty();
    showToast('❄️ ' + teamNameOf(other) + ' يفقد دوره القادم');
  }

  /* 🚫 امنع الخصم — لا يحق له أخذ نقاط هذا السؤال إن أخطأت */
  function helpBlock(other){
    blockedTeam = other;
    const btn = document.getElementById('btn-' + other);
    if (btn) {
      btn.disabled = true;
      btn.style.opacity = '.4';
      btn.style.cursor = 'not-allowed';
    }
    showToast('🚫 ' + teamNameOf(other) + ' ممنوع من الإجابة على هذا السؤال');
  }

  /* 🔎 البحث — يفتح بحث جوجل عن نص السؤال، ومؤقّت السؤال متوقف ٣٠ ثانية */
  function helpSearch(){
    const q = item ? (item.q || '') : '';
    try { window.open('https://www.google.com/search?q=' + encodeURIComponent(q), '_blank', 'noopener'); } catch (e) {}
    timedPause({
      emoji: '🔎', title: 'البحث في الإنترنت',
      note: 'مؤقّت السؤال متوقف أثناء البحث',
      end: '<i class="fa-solid fa-magnifying-glass"></i> إنهاء البحث'
    });
  }

  /* 📉 خفّض نقاط الخصم — خصم عشوائي من ١٠٠ إلى ٥٠٠ (مرة واحدة في الجولة) */
  function helpCutPoints(other){
    const n = Powerups.deductPoints(other, Powerups.randomCut());
    refreshScoreChips();
    if (window.SFX) SFX.penalty();
    showToast('📉 خُصمت ' + n + ' نقطة من ' + teamNameOf(other));
  }

  renderHelps();

  /* الترجمة تبدأ بعد أن تُهيّئ i18n اللغة المختارة، لأن I18N.init()
     يعمل عند DOMContentLoaded أي بعد تنفيذ هذا السكربت. */
  document.addEventListener("DOMContentLoaded", applyTranslation);
  document.addEventListener("i18n:change", applyTranslation);
  if (document.readyState !== "loading") applyTranslation();

  /* ---------------- reveal ---------------- */
  /* ---------------- صورة الإجابة ----------------
     بعد كشف الإجابة نجلب لها صورة من الإنترنت (نفس محرّك صور الأسئلة:
     ويكيبيديا وكومنز، وجوجل إن ربط اللاعب مفتاحه). لا تظهر قبل الكشف
     إطلاقاً حتى لا تحرق الجواب.

     نتخطّاها في ثلاث حالات: أن يكون البحث التلقائي مطفأً من الإعدادات،
     أو أن يعيد المحرّك بطاقته المولّدة (أي لم يجد شيئاً)، أو أن تكون
     الصورة نفسها صورة السؤال — فلا فائدة من تكرارها. */
  /* فئات الأنمي: صورة الإجابة يجب أن تكون كرتونية لا صورة فوتوغرافية.
     نأخذها من بنك الأسئلة نفسه — فيه رسم رسمي لكل شخصية (AniList) —
     بدل البحث في ويكيبيديا الذي يعطي نتائج غريبة للأسماء اليابانية.
     أضف أي فئة أنمي جديدة هنا وتعمل تلقائياً. */
  const CARTOON_CATEGORIES = ["دراغون بول", "المحقق كونان", "البوكيمون"];

  /* فئات لا نبحث لإجاباتها في الإنترنت إطلاقاً: البحث عن اسم نبي أو صحابي
     يعيد أيقونات ولوحات تجسّدهم، وهذا لا يجوز. صورة السؤال المختارة يدوياً
     (خطّ أو مكان) تكفي، ولا نضيف تحتها شيئاً. */
  const NO_ANSWER_IMAGE_CATEGORIES = [
    "اسلامي", "قرآن وسيرة", "الأنبياء والرسل", "قصص الأنبياء",
    "الحج والعمرة", "من القارئ"
  ];

  function cartoonAnswerImage() {
    const bank = (window.questionsData || {})[category] || [];
    const norm = (s) => (s || "").replace(/[«»"'‏]/g, "").trim();
    const target = norm(item.a);
    if (!target) return null;

    /* رسم الشخصية نفسها، من سؤال آخر في الفئة إجابته نفس الإجابة.
       لا نضع غلاف المسلسل احتياطاً: الأسئلة التي إجابتها ليست شخصية
       تعرض الغلاف أصلاً في السؤال، فتكراره تحت الإجابة بلا فائدة. */
    for (const q of bank) {
      if (q === item) continue;
      if (norm(q.a) === target && q.img && q.img.indexOf("/character/") >= 0) return q.img;
    }
    return null;
  }

  /* ---------- تغطية اسم المنتج على صورة السؤال ----------
     في فئة «منتجات» يكون اسم المنتج مطبوعاً على العبوة نفسها،
     فتكشفه الصورة قبل أن يجيب أحد. الحقل hide يحمل مستطيلات
     تغطّيه في السؤال: [[x, y, w, h], …] نسبةً مئوية من عرض
     الصورة وارتفاعها. وعند إظهار الإجابة تُعرض الصورة كاملة
     بلا تغطية، فيرى اللاعبون الاسم. صورة واحدة تكفي للاثنين. */
  /* غلاف الصورة الذي تُرسم فوقه الطبقات (أقنعة التغبيش وأرقام الخريطة).
     غلاف واحد مشترك، فتجتمع الطبقتان على الصورة نفسها، ويستنسخه التكبير
     كاملاً بما عليه (انظر zoom.open). */
  function overlayWrap(shell) {
    if (!shell) return null;
    const existing = shell.querySelector(".hide-wrap");
    if (existing) return existing;
    const img = shell.querySelector("img");
    if (!img) return null;
    const wrap = document.createElement("span");
    wrap.className = "hide-wrap";
    img.replaceWith(wrap);
    wrap.appendChild(img);
    return wrap;
  }

  /* ---------- أرقام على الخريطة ----------
     labels = [[x, y, "نص"], …] — شارة صغيرة مركزها عند (x٪، y٪) من الصورة.
     في «مناطق تركيا» مثلاً: رقم على كل منطقة في خريطة صمّاء، والسؤال
     «ما اسم المنطقة رقم ٣؟». الأرقام تبقى مع الصورة عند التكبير.
     mark = نص الرقم المسؤول عنه، يُبرَز في صورة الإجابة. */
  function applyLabels(shell, labels, mark) {
    if (!Array.isArray(labels) || !labels.length) return;
    const wrap = overlayWrap(shell);
    if (!wrap) return;
    labels.forEach(l => {
      if (!Array.isArray(l) || l.length < 3) return;
      const tag = document.createElement("b");
      tag.className = "map-label" + (mark != null && String(l[2]) === String(mark) ? " on" : "");
      tag.textContent = String(l[2]);
      tag.style.left = l[0] + "%";
      tag.style.top  = l[1] + "%";
      wrap.appendChild(tag);
    });
  }

  function applyHideMasks(shell, rects) {
    if (!Array.isArray(rects) || !rects.length || !shell) return;
    const wrap = overlayWrap(shell);
    if (!wrap) return;

    rects.forEach(r => {
      if (!Array.isArray(r) || r.length < 4) return;
      const mask = document.createElement("i");
      mask.className = "hide-mask";
      mask.style.cssText =
        "left:" + r[0] + "%;top:" + r[1] + "%;width:" + r[2] + "%;height:" + r[3] + "%;";
      wrap.appendChild(mask);
    });
  }

  function showAnswerImage() {
    const holder = document.getElementById("answerMedia");
    if (!holder || !item) return;

    /* خريطة مرقّمة: نعيدها في الإجابة بأرقامها، ورقم المنطقة المسؤول
       عنها مُبرَز — فيرى اللاعبون موضع الجواب على الخريطة. */
    if (!item.aimg && Array.isArray(item.labels) && item.labels.length && item.img) {
      mountAnswerImage(holder, item.img, true);
      applyLabels(holder, item.labels, item.mark);
      return;
    }

    /* صورة مقصوصة في السؤال — نعرضها كاملة الآن:
       الشعار كاملاً بكتابته، والخريطة كاملة وعليها الحلقة نفسها. */
    if (!item.aimg && (item.crop || item.streets) && item.img) {
      if (item.pin) {
        cropImage(item.img, [0, 0, 100, 100], item.pin)
          .then(url => mountAnswerImage(holder, url, true))
          .catch(() => mountAnswerImage(holder, item.img, true));
      } else {
        mountAnswerImage(holder, item.img, true);
      }
      return;
    }

    /* اسم المنتج كان مغطّى في السؤال — نعرض الصورة كاملة الآن */
    if (!item.aimg && Array.isArray(item.hide) && item.hide.length && item.img) {
      mountAnswerImage(holder, item.img, true);
      return;
    }

    /* فئة صورتها للإجابة (الأنبياء والرسل): صورة السؤال لم تُعرض في
       السؤال، فتظهر الآن مع الإجابة. وقبل فحص NO_ANSWER_IMAGE_CATEGORIES
       لأن الفئة مدرجة فيه. وما لا صورة له في البنك يبقى بلا صورة. */
    if (imageInAnswer) {
      if (item.img) mountAnswerImage(holder, item.img, true);
      else holder.hidden = true;
      return;
    }

    /* صورة إجابة محددة في البنك (aimg) — مثل خريطة الدولة في منطقتها
       في فئة الخرائط. لا نبحث عن غيرها، لأن البحث باسم الدولة قد يعيد
       صورة لا علاقة لها بها. وإن لم تُحمَّل (بلا إنترنت) نعرض بدلها شكل
       الدولة المحلي (shape) إن وُجد، فتبقى صورة الإجابة خريطة الدولة نفسها. */
    if (item.aimg) {
      const probe = new Image();
      probe.onload  = () => mountAnswerImage(holder, item.aimg);
      probe.onerror = () => { if (item.shape) mountAnswerImage(holder, item.shape); };
      probe.src = item.aimg;
      return;
    }

    if (!window.Images) return;

    /* نحترم مفتاح «البحث التلقائي عن الصور» في الإعدادات — وهو نفسه
       الذي يوقف جلب صور الأسئلة (مفيد للّعب بلا إنترنت). */
    let allowed = true;
    try { allowed = localStorage.getItem("autoImages") !== "0"; } catch (e) {}
    if (!allowed) return;

    if (NO_ANSWER_IMAGE_CATEGORIES.indexOf(category) >= 0) return;

    /* فئات الأنمي: مصدر محلي من البنك، بلا بحث على الإنترنت */
    if (CARTOON_CATEGORIES.indexOf(category) >= 0) {
      const art = cartoonAnswerImage();
      if (art) { mountAnswerImage(holder, art); }
      return;
    }

    /* لا بحث تلقائي عن صورة للإجابة.
       صورة الإجابة تظهر فقط إن كانت مكتوبة في البنك (aimg — كخريطة
       الدولة في فئة الخرائط) أو من بنك صور الأنمي أعلاه. وما عدا ذلك
       تُعرض الإجابة نصاً بلا صورة. */
    holder.hidden = true;
  }

  /* يرسم صورة الإجابة بعد فحصها — يشترك فيه المساران (بحث الإنترنت وبنك الأنمي) */
  function mountAnswerImage(holder, url, allowSameAsQuestion) {
    holder.classList.remove("loading");

    /* بطاقة مولّدة (data:) تعني أن البحث لم يجد صورة حقيقية.
       أمّا الصور التي نرسمها نحن (خريطة عليها حلقة) فتُمرَّر بـ allowSameAsQuestion. */
    if (!url || (url.indexOf("data:") === 0 && !allowSameAsQuestion)) { holder.hidden = true; return; }

    /* نقارن بالصورة المعروضة فعلاً في السؤال — لا بالحقل img وحده،
       لأن الأسئلة بلا صورة مثبّتة يجلب لها المحرّك صورة بنفس عبارة
       البحث فتخرج الصورتان متطابقتين. والمقارنة باسم الملف لأن
       المحرّك يضيف أحياناً معاملات ?utm_source إلى الرابط. */
    const fileOf = (u) => {
      if (!u) return "";
      try { return decodeURIComponent(u.split("?")[0].split("/").pop()).toLowerCase(); }
      catch (e) { return u; }
    };
    const qImg = document.querySelector("#questionMedia img");
    const qSrc = qImg ? (qImg.currentSrc || qImg.src) : (item.img || "");
    /* في فئة «منتجات» الصورتان واحدة عمداً: الاسم مغطّى في السؤال
       ومكشوف في الإجابة، فلا نطبّق فحص التطابق هنا. */
    if (!allowSameAsQuestion &&
        fileOf(url) && (fileOf(url) === fileOf(qSrc) || fileOf(url) === fileOf(item.img))) {
      holder.hidden = true; return;
    }

    holder.hidden = false;
    const img = document.createElement("img");
    img.alt = "صورة الإجابة: " + (item.a || "");
    if (isLogoCategory) img.className = "logoimg";
    img.src = url;
    enlargeSmallLogo(img);
    img.onerror = () => { holder.hidden = true; };
    img.onload = () => {
      const cap = document.createElement("span");
      cap.className = "cap";
      cap.innerHTML = '<i class="fa-solid fa-image"></i> صورة الإجابة — اضغطها لتكبيرها';
      holder.appendChild(cap);
      /* نفس شاشة التكبير المستعملة لصور الأسئلة */
      if (typeof zoom !== "undefined") img.addEventListener("click", () => zoom.open(img));
    };
    holder.appendChild(img);
  }

  function revealAnswer(auto){
    if (revealed) return;
    revealed = true;
    clearInterval(ticker);
    document.body.classList.remove("hurry");

    SFX.reveal();
    try { if (questionAudio) questionAudio.pause(); } catch(e){}
    try { if (questionVideo) questionVideo.pause(); } catch(e){}
    /* المقطع بالأبيض والأسود يعود ملوّناً مع الإجابة */
    document.querySelectorAll('.vid.bw').forEach(v => v.classList.add('shown'));

    if (item) {
      const aEl = document.getElementById("answerText");
      aEl.textContent = shownA;
      if (shownA !== item.a) addOriginal(aEl, item.a);
    }

    document.getElementById("preRow").hidden = true;
    document.getElementById("timerBox").style.opacity = '.45';
    document.getElementById("timerBox").style.transform = 'scale(.85)';
    document.getElementById("answerBox").hidden = false;
    document.getElementById("answerBox").scrollIntoView({ behavior: "smooth", block: "nearest" });

    /* المساعدات تُقفل بعد كشف الإجابة */
    if (typeof renderHelps === "function") renderHelps();

    showAnswerImage();

    if (auto) showToast("انتهى الوقت! ظهرت الإجابة.");
  }

  /* ---------------- award points ---------------- */
  /* الإجابة الصحيحة لفريق فيه لاعبون: نسأل من أجاب منهم، فيكسب ٣ نقاط
     لاعب (Teams.PLAYER_POINTS) تُجمع في قائمة اللاعبين بالإعدادات */
  let awarding = false;
  function award(team){
    /* «امنع الخصم»: الفريق الممنوع لا يأخذ نقاط هذا السؤال */
    if (awarding || (team && team === blockedTeam)) return;
    const mem = team ? Teams.members(team) : [];
    if (!mem.length) { awarding = true; finishAward(team, null); return; }
    pickPlayer(team, mem).then(player => {
      if (player === undefined) return;          /* أُلغيت النافذة — لم يُحتسب شيء بعد */
      awarding = true;
      finishAward(team, player);
    });
  }

  /* نافذة «من أجاب؟» — تعيد اسم اللاعب، أو null (بلا لاعب)، أو undefined (إلغاء) */
  function pickPlayer(team, mem){
    return new Promise(resolve => {
      const ov = document.createElement('div');
      ov.className = 'pick-team';
      ov.innerHTML = '<div class="pt-card"><h5></h5><div class="pt-list"></div>' +
                     '<button type="button" class="pt-cancel pt-none">بدون تحديد لاعب</button><br>' +
                     '<button type="button" class="pt-cancel">إلغاء</button></div>';
      ov.querySelector('h5').textContent = 'من أجاب من ' + nameOf(team) + '؟ (+' + Teams.PLAYER_POINTS + ' نقاط للاعب)';
      const done = (v) => { ov.remove(); resolve(v); };
      mem.forEach(m => {
        const b = document.createElement('button');
        b.type = 'button';
        b.className = 'pt-btn';
        b.style.setProperty('--tc', Teams.color(team).main);
        b.innerHTML = '<span data-no-i18n></span><small></small>';
        b.querySelector('span').textContent = m;
        b.querySelector('small').textContent = Teams.playerPoints(m) + ' نقطة';
        b.onclick = () => done(m);
        ov.querySelector('.pt-list').appendChild(b);
      });
      ov.querySelector('.pt-none').onclick = () => done(null);
      ov.querySelectorAll('.pt-cancel')[1].onclick = () => done(undefined);
      ov.addEventListener('click', e => { if (e.target === ov) done(undefined); });
      document.body.appendChild(ov);
      if (window.I18N) I18N.apply(ov);
    });
  }

  function finishAward(team, player){
    team ? SFX.correctAnswer() : SFX.wrongAnswer();
    const s = Teams.scores();
    let msg;
    /* ٣ نقاط للاعب الذي أجاب */
    const playerMsg = (team && player)
      ? ' · ⭐ ' + player + ' +' + Teams.PLAYER_POINTS + ' (' + Teams.addPlayerPoints(player) + ')'
      : '';

    /* 🎡 سؤال العجلة: القيمة × المضاعف، بلا مفاجآت، ولا يُعلَّم على اللوحة ولا يغيّر الدور */
    if (bonusMode) {
      if (team) {
        const amount = points * mult;
        s[team] = (s[team] || 0) + amount;
        localStorage.setItem('teamScores', JSON.stringify(s));
        const acc = parseInt(localStorage.getItem("points")) || 0;
        localStorage.setItem("points", acc + 1);
        msg = '🎡 ' + trT('{team} كسب {n} نقطة ({p} × {m})',
              { team: nameOf(team), n: amount, p: points, m: mult }) + playerMsg;
      } else {
        msg = trT(bonusMode === 'tie'
          ? 'لم يجب أحد — ما زال التعادل، تدور العجلة من جديد'
          : 'لم يجب أحد على السؤال الإضافي');
      }
      showToast(msg);
      setTimeout(() => { window.location.href = "SelectSections.html"; }, 2000);
      return;
    }

    if (team) {
      /* المفاجأة تُحسم الآن: مكافأة لمن أجاب، وعقوبة على من لم يجب */
      const plan = window.Powerups
        ? Powerups.settle(category, points, team)
        : { to: team, amount: points, penalty: null, freeze: null, note: "" };

      if (window.Powerups) {
        Powerups.apply(plan);
      } else {
        s[plan.to] = (s[plan.to] || 0) + plan.amount;
        localStorage.setItem('teamScores', JSON.stringify(s));
      }

      // نقطة حساب واحدة للاعب عن كل إجابة صحيحة (كل 20 نقطة = رصيد)
      const acc = parseInt(localStorage.getItem("points")) || 0;
      localStorage.setItem("points", acc + 1);

      const toName = nameOf(plan.to);
      msg = "تمت إضافة " + plan.amount + " نقطة لـ " + toName + playerMsg;
      if (plan.note) msg = plan.note + " · " + msg;
      /* مع أكثر من فريقين تقع العقوبة على أقوى خصم — نسمّيه */
      const hit = (plan.penalty && plan.penalty.team) || plan.freeze;
      if (hit && TEAM_IDS.length > 2) msg += " · وقعت العقوبة على " + nameOf(hit);
    } else {
      /* لا أحد أجاب — المفاجأة لا تعمل إطلاقاً */
      msg = surprise
        ? "لم يجب أحد — لم تعمل المفاجأة"
        : "لم يحصل أحد على النقاط";
    }

    // تعليم السؤال كمُجاب واستهلاك المفاجأة
    const answered = JSON.parse(localStorage.getItem('answeredQuestions')) || [];
    const key = category + "_" + points;
    if (!answered.includes(key)) answered.push(key);
    localStorage.setItem('answeredQuestions', JSON.stringify(answered));
    if (window.Powerups) Powerups.consume(category, points);

    // تبديل الدور — مع تخطّي الفريق المجمّد
    const next = window.Powerups
      ? Powerups.nextTurn(currentTurn)
      : Teams.next(currentTurn);
    localStorage.setItem("currentTurn", next);
    if (next === currentTurn) msg += TEAM_IDS.length > 2 ? " · 🧊 الفرق الأخرى مجمّدة، الدور يبقى معك" : " · 🧊 الخصم مجمّد، الدور يبقى معك";

    showToast(msg);

    setTimeout(() => { window.location.href = "SelectSections.html"; }, 2000);
  }

  /* ---------------- أزرار الصوت ----------------
     الموسيقى الخلفية تتوقف أثناء السؤال (دون تغيير إعدادها)، وتعود
     تلقائياً عند الرجوع للوحة بعد انتهائه. */
  SFX.mountControls({ music: false });

  /* ---------------- تكبير صورة السؤال ----------------
     ننسخ عنصر الصورة نفسه إلى شاشة كاملة (وننسخ حاوية الخريطة كاملة
     حتى يبقى مؤشّر الدولة في موضعه)، ثم نكبّر بالـ transform.
     التكبير: أزرار + و −، وعجلة الفأرة، ونقرة مزدوجة، والسحب للتحريك. */
  const zoom = (function () {
    const box   = document.getElementById('imgZoom');
    const stage = document.getElementById('zoomStage');
    const lvl   = document.getElementById('zoomLevel');
    const inBtn = document.getElementById('zoomIn');
    const outBtn= document.getElementById('zoomOut');

    const MIN = 1, MAX = 5, STEP = 0.5;
    let scale = 1, x = 0, y = 0, node = null;
    let dragging = false, sx = 0, sy = 0, moved = false;

    function paint() {
      if (node) node.style.transform = `translate(${x}px, ${y}px) scale(${scale})`;
      lvl.textContent = Math.round(scale * 100) + '٪';
      inBtn.disabled  = scale >= MAX;
      outBtn.disabled = scale <= MIN;
    }

    function setScale(next) {
      scale = Math.min(MAX, Math.max(MIN, Math.round(next * 10) / 10));
      if (scale === MIN) { x = 0; y = 0; }   // العودة للحجم الطبيعي تعيد التوسيط
      paint();
    }

    function open(source) {
      /* صورة عليها تغبيش لاسم المنتج: نستنسخ غلافها بأقنعته لا الصورة
         وحدها، وإلا ظهر الاسم واضحاً في نافذة التكبير. */
      const masked = source.closest ? source.closest('.hide-wrap') : null;
      node = (masked || source).cloneNode(true);
      node.classList.remove('zoomable');
      node.removeAttribute('id');
      stage.innerHTML = '';
      stage.appendChild(node);
      scale = 1; x = 0; y = 0;
      paint();
      box.classList.add('on');
      document.body.style.overflow = 'hidden';
      if (window.SFX) SFX.select();
    }

    function close() {
      box.classList.remove('on');
      stage.innerHTML = '';
      node = null;
      document.body.style.overflow = '';
    }

    inBtn.onclick  = () => setScale(scale + STEP);
    outBtn.onclick = () => setScale(scale - STEP);
    document.getElementById('zoomClose').onclick = close;

    /* النقر على الخلفية يغلق، والنقر المزدوج يكبّر أو يعيد */
    stage.addEventListener('click', (e) => { if (e.target === stage && !moved) close(); });
    /* لا نكبّر إن كانت النقرة جزءاً من سحب */
    stage.addEventListener('dblclick', () => { if (!moved) setScale(scale >= MAX ? MIN : scale + 1); });

    stage.addEventListener('wheel', (e) => {
      e.preventDefault();
      setScale(scale + (e.deltaY < 0 ? STEP : -STEP));
    }, { passive: false });

    /* السحب لتحريك الصورة حين تكون مكبّرة، والقرص بإصبعين للتكبير على الهواتف.
       نتابع كل المؤشرات الملامسة: مؤشّر واحد = سحب، اثنان = قرص. */
    const pts = new Map();
    let pinchDist = 0, pinchScale = 1;

    stage.addEventListener('pointerdown', (e) => {
      pts.set(e.pointerId, { x: e.clientX, y: e.clientY });
      stage.setPointerCapture(e.pointerId);

      if (pts.size === 2) {
        const [a, b] = [...pts.values()];
        pinchDist  = Math.hypot(a.x - b.x, a.y - b.y);
        pinchScale = scale;
        dragging = false;
        moved = true;                     /* القرص ليس نقرة */
        return;
      }

      moved = false;
      if (scale <= MIN) return;
      dragging = true; sx = e.clientX - x; sy = e.clientY - y;
      stage.classList.add('dragging');
    });

    stage.addEventListener('pointermove', (e) => {
      if (!pts.has(e.pointerId)) return;
      pts.set(e.pointerId, { x: e.clientX, y: e.clientY });

      if (pts.size >= 2) {                /* قرص بإصبعين */
        const [a, b] = [...pts.values()];
        const d = Math.hypot(a.x - b.x, a.y - b.y);
        if (pinchDist > 0) {
          scale = Math.min(MAX, Math.max(MIN, pinchScale * (d / pinchDist)));
          if (scale <= MIN) { x = 0; y = 0; }
          paint();
        }
        return;
      }

      if (!dragging) return;
      const nx = e.clientX - sx, ny = e.clientY - sy;
      if (Math.abs(nx - x) > 3 || Math.abs(ny - y) > 3) moved = true;
      x = nx; y = ny; paint();
    });

    ['pointerup', 'pointercancel'].forEach(ev =>
      stage.addEventListener(ev, (e) => {
        pts.delete(e.pointerId);
        if (pts.size < 2) pinchDist = 0;
        if (pts.size === 0) {
          dragging = false;
          stage.classList.remove('dragging');
          /* نفرغ العلامة بعد انتهاء دورة النقر حتى لا تُحسب النقرة التالية سحباً */
          setTimeout(() => { moved = false; }, 350);
        }
      }));

    return { open, close, isOpen: () => box.classList.contains('on') };
  })();

  /* تفعيل التكبير على وسائط السؤال بعد بنائها */
  function enableZoom() {
    const media = document.getElementById('questionMedia');
    if (!media) return;
    const target = media.querySelector('.worldpin') || media.querySelector('img');
    if (!target || media.querySelector('.zoom-tip')) return;

    target.classList.add('zoomable');
    target.addEventListener('click', () => zoom.open(target));

    const tip = document.createElement('button');
    tip.type = 'button';
    tip.className = 'zoom-tip';
    tip.innerHTML = '<i class="fa-solid fa-magnifying-glass-plus"></i> اضغط الصورة لتكبيرها';
    tip.onclick = () => zoom.open(target);
    media.appendChild(tip);
  }

  /* الوسائط تُبنى بعضها لاحقاً (محرّك الصور)، فنراقب الحاوية */
  (function () {
    const media = document.getElementById('questionMedia');
    if (!media) return;
    enableZoom();
    new MutationObserver(() => enableZoom()).observe(media, { childList: true, subtree: true });
  })();

  /* ---------------- keyboard shortcuts ---------------- */
  document.addEventListener("keydown", (e) => {
    if (zoom.isOpen()) {
      if (e.key === "Escape") { e.preventDefault(); zoom.close(); }
      return;                       /* أثناء التكبير لا تعمل بقية الاختصارات */
    }
    if (e.code === "Space" && !revealed){ e.preventDefault(); revealAnswer(); }
    else if (e.key.toLowerCase() === "p" && !revealed){ togglePause(); }
  });
</script>
</body>
