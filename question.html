<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<link rel="icon" href="image/jawbnny.png" type="image/png">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0a2a25">
<link rel="apple-touch-icon" href="image/icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="&#1580;&#1575;&#1608;&#1576;&#1606;&#1610;">
<script src="pwa.js" defer></script>
  <title>السؤال — جاوبني</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&family=Tajawal:wght@300;400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css" crossorigin="anonymous" referrerpolicy="no-referrer">

  <style>
    :root{
      --ink:#04120f;
      --ink-deep:#020b09;
      --glass:rgba(21,74,65,.45);
      --gold:#e7b740;
      --gold-soft:#f7dd9c;
      --gold-deep:#b6851d;
      --coral:#ff6b4d;
      --coral-dim:#e04a2c;
      --blue:#4a9bff;
      --green:#3fae95;
      --green-soft:#8fe3d0;
      --ivory:#f5f1e6;
      --muted:#9fc2bb;
      --line:rgba(231,183,64,.22);
      --line-strong:rgba(231,183,64,.5);
      --shadow-lg:0 30px 70px rgba(0,0,0,.55);
    }

    *{ box-sizing:border-box; }
    [hidden]{ display:none !important; }

    body{
      margin:0;
      background:var(--ink);
      color:var(--ivory);
      font-family:'Tajawal', sans-serif;
      min-height:100vh;
      overflow-x:hidden;
      text-align:center;
      padding-bottom:50px;
    }

    /* ---------- background ---------- */
    .bg-fx{
      position:fixed; inset:0; z-index:-2; overflow:hidden;
      background:
        radial-gradient(1000px 620px at 50% -12%, #17604f 0%, transparent 62%),
        radial-gradient(900px 620px at 10% 20%, #123f37 0%, transparent 58%),
        radial-gradient(700px 700px at 90% 100%, #1a5b4d 0%, transparent 60%),
        linear-gradient(180deg, #061814 0%, var(--ink) 55%, #030d0b 100%);
      transition:background .6s ease;
    }
    .bg-fx .orb{ position:absolute; border-radius:50%; filter:blur(90px); opacity:.3; animation:float 18s ease-in-out infinite; }
    .bg-fx .orb.a{ width:420px; height:420px; background:#1f7d68; top:-100px; right:-60px; }
    .bg-fx .orb.b{ width:380px; height:380px; background:#c9962f; bottom:-120px; left:-80px; opacity:.18; animation-delay:-6s; }
    @keyframes float{ 0%,100%{ transform:translate3d(0,0,0) scale(1);} 50%{ transform:translate3d(0,-38px,0) scale(1.12);} }
    .bg-fx::after{
      content:""; position:absolute; inset:0;
      background-image:radial-gradient(rgba(255,255,255,.045) 1px, transparent 1px);
      background-size:3px 3px; opacity:.5;
    }
    body.hurry .bg-fx{ background:
        radial-gradient(1000px 620px at 50% -12%, #6b2416 0%, transparent 62%),
        radial-gradient(900px 620px at 10% 20%, #2a1512 0%, transparent 58%),
        linear-gradient(180deg, #1a0a07 0%, #0b0503 60%, #030101 100%); }
    @media (prefers-reduced-motion: reduce){ .bg-fx .orb{ animation:none; } }

    .lightbar{
      height:6px;
      background:radial-gradient(circle, var(--gold-soft) 38%, transparent 42%) 0 0 / 24px 24px repeat-x;
      filter:drop-shadow(0 0 6px rgba(231,183,64,.8));
      animation:twinkle 1.8s linear infinite;
    }
    @keyframes twinkle{
      0%,100%{ filter:drop-shadow(0 0 4px rgba(231,183,64,.6)); background-position-x:0; }
      50%{ filter:drop-shadow(0 0 12px rgba(231,183,64,1)); background-position-x:12px; }
    }
    @media (prefers-reduced-motion: reduce){ .lightbar{ animation:none; } }

    /* ---------- header ---------- */
    header{
      position:sticky; top:0; z-index:40;
      background:linear-gradient(180deg, rgba(13,51,45,.92), rgba(4,18,15,.82));
      backdrop-filter:blur(16px) saturate(140%);
      -webkit-backdrop-filter:blur(16px) saturate(140%);
      padding:12px 24px;
      display:flex; justify-content:space-between; align-items:center; gap:14px;
      border-bottom:1px solid var(--line);
      box-shadow:0 12px 40px rgba(0,0,0,.4);
      flex-wrap:wrap;
    }
    .head-brand{ display:flex; align-items:center; gap:12px; }
    .logo{ width:48px; height:48px; border-radius:15px; object-fit:cover;
      box-shadow:0 0 0 2px var(--gold), 0 8px 22px rgba(0,0,0,.45); }
    .head-brand b{
      font-family:'Cairo', sans-serif; font-weight:900; font-size:20px;
      background:linear-gradient(120deg, var(--gold-soft), var(--gold) 50%, #fff6dd 65%, var(--gold));
      background-size:200% auto;
      -webkit-background-clip:text; background-clip:text; color:transparent;
      animation:shineText 5s linear infinite;
    }
    @keyframes shineText{ to{ background-position:200% center; } }

    .turn-pill{
      display:inline-flex; align-items:center; gap:9px;
      background:var(--glass);
      border:1px solid var(--line);
      border-radius:999px;
      padding:9px 18px;
      font-family:'Cairo', sans-serif;
      font-weight:800; font-size:13.5px;
      backdrop-filter:blur(8px);
    }
    .turn-pill .dot{
      width:9px; height:9px; border-radius:50%;
      background:var(--gold);
      box-shadow:0 0 0 0 rgba(231,183,64,.7);
      animation:pulse 1.8s infinite;
    }
    @keyframes pulse{ 70%{ box-shadow:0 0 0 10px rgba(231,183,64,0);} 100%{ box-shadow:0 0 0 0 rgba(231,183,64,0);} }
    .turn-pill b{ color:var(--gold); }

    .ghost-link{
      background:rgba(255,107,77,.1);
      border:1px solid rgba(255,107,77,.35);
      border-radius:999px;
      padding:9px 16px;
      color:#ff9c89;
      font-family:'Cairo', sans-serif;
      font-weight:700; font-size:13px;
      text-decoration:none;
      display:inline-flex; align-items:center; gap:8px;
      cursor:pointer;
      transition:background .2s ease, transform .2s ease;
    }
    .ghost-link:hover{ background:rgba(255,107,77,.22); transform:translateY(-2px); }

    /* ---------- stage ---------- */
    .stage{ max-width:900px; margin:36px auto 0; padding:0 22px; }

    .meta{
      display:flex; align-items:center; justify-content:center;
      gap:12px; flex-wrap:wrap;
      margin-bottom:22px;
    }
    .cat-badge{
      font-family:'Cairo', sans-serif;
      font-weight:800; font-size:14px;
      color:var(--gold-soft);
      background:rgba(231,183,64,.1);
      border:1px solid var(--line);
      border-radius:999px;
      padding:9px 20px;
      backdrop-filter:blur(8px);
    }
    .map-badge{
      font-family:'Cairo', sans-serif;
      font-weight:800; font-size:13px;
      color:#bfe6db;
      background:rgba(63,174,149,.16);
      border:1px solid rgba(95,208,168,.4);
      border-radius:999px;
      padding:9px 18px;
      display:inline-flex; align-items:center; gap:8px;
      backdrop-filter:blur(8px);
    }
    .map-badge::before{ content:"\f279"; font-family:"Font Awesome 6 Free"; font-weight:900; }
    .pts-badge{
      font-family:'Cairo', sans-serif;
      font-weight:900; font-size:15px;
      color:var(--ink-deep);
      background:linear-gradient(135deg, var(--gold-soft), var(--gold));
      border-radius:999px;
      padding:9px 22px;
      box-shadow:0 10px 26px rgba(231,183,64,.35);
    }

    /* ---------- timer ---------- */
    .timer{
      position:relative;
      transition:opacity .4s ease, transform .4s ease;
      width:132px; height:132px;
      margin:0 auto 26px;
    }
    .timer svg{ transform:rotate(-90deg); display:block; }
    .timer circle{ fill:none; stroke-linecap:round; }
    .timer .track{ stroke:rgba(255,255,255,.09); stroke-width:9; }
    .timer .prog{
      stroke:url(#tg);
      stroke-width:9;
      transition:stroke-dashoffset 1s linear, stroke .4s ease;
      filter:drop-shadow(0 0 8px rgba(231,183,64,.55));
    }
    .timer .num{
      position:absolute; inset:0;
      display:flex; flex-direction:column; align-items:center; justify-content:center;
      font-family:'Cairo', sans-serif;
      font-weight:900; font-size:38px;
      color:var(--gold);
      line-height:1;
    }
    .timer .num small{
      font-size:11px; font-weight:700; color:var(--muted);
      margin-top:5px; letter-spacing:1px;
    }
    body.hurry .timer .num{ color:var(--coral); animation:beat .7s ease-in-out infinite; }
    body.hurry .timer .prog{ filter:drop-shadow(0 0 12px rgba(255,107,77,.8)); }
    @keyframes beat{ 0%,100%{ transform:scale(1);} 50%{ transform:scale(1.12);} }
    @media (prefers-reduced-motion: reduce){ body.hurry .timer .num{ animation:none; } }

    /* ---------- أشكال الساعة (data-style) — --p = نسبة الوقت الباقي ---------- */
    .timer{ --p:1; --tc:var(--gold); }
    body.hurry .timer{ --tc:var(--coral); }
    .timer .t-pie, .timer .t-bar{ display:none; }

    /* زر تغيير الشكل بجانب الساعة */
    .timer .t-style{
      position:absolute; top:50%; inset-inline-end:-46px; margin-top:-17px;
      width:34px; height:34px; border-radius:50%; cursor:pointer;
      border:1px solid var(--line); background:rgba(4,18,15,.6); color:var(--gold);
      font-size:14px; display:grid; place-items:center;
      transition:border-color .2s ease, transform .2s ease;
    }
    .timer .t-style:hover{ border-color:var(--line-strong); transform:rotate(-30deg); }

    /* قرص يفرغ مع الوقت */
    .timer[data-style="pie"] svg{ display:none; }
    .timer[data-style="pie"] .t-pie{
      display:block; position:absolute; inset:0; border-radius:50%;
      background:conic-gradient(var(--tc) calc(var(--p) * 360deg), rgba(255,255,255,.08) 0);
      box-shadow:0 0 22px rgba(231,183,64,.3);
      transition:background .4s ease;
    }
    .timer[data-style="pie"] .t-pie::after{
      content:""; position:absolute; inset:24px; border-radius:50%;
      background:#08231e; box-shadow:inset 0 0 0 1px rgba(231,183,64,.2);
    }

    /* شريط أفقي والرقم فوقه */
    .timer[data-style="bar"]{ width:min(340px, 80vw); height:78px; }
    .timer[data-style="bar"] svg{ display:none; }
    .timer[data-style="bar"] .num{ inset:0 0 22px; flex-direction:row; gap:8px; align-items:baseline; }
    .timer[data-style="bar"] .num small{ margin:0; }
    .timer[data-style="bar"] .t-bar{
      display:block; position:absolute; left:0; right:0; bottom:0; height:14px;
      border-radius:999px; background:rgba(255,255,255,.08); overflow:hidden;
      box-shadow:inset 0 0 0 1px rgba(231,183,64,.18);
    }
    .timer[data-style="bar"] .t-bar span{
      position:absolute; inset-block:0; inset-inline-start:0; width:calc(var(--p) * 100%);
      border-radius:999px; background:linear-gradient(90deg, var(--gold-soft), var(--tc));
      transition:width 1s linear;
    }

    /* رقمية: لوحة داكنة وأرقام متوهّجة 0:45 */
    .timer[data-style="digital"]{ width:190px; height:92px; }
    .timer[data-style="digital"] svg{ display:none; }
    .timer[data-style="digital"] .num{
      border-radius:18px; background:#03100d;
      box-shadow:inset 0 0 0 2px rgba(231,183,64,.35), 0 12px 30px rgba(0,0,0,.45);
      font-family:'Courier New', ui-monospace, monospace; font-size:46px; letter-spacing:3px;
      color:var(--tc); text-shadow:0 0 12px var(--tc); direction:ltr;
    }
    .timer[data-style="digital"] .num small{ display:none; }

    /* ---------- cards ---------- */
    .q-card{
      border:1px solid var(--line);
      border-radius:28px;
      padding:36px 32px;
      background:linear-gradient(150deg, rgba(21,74,65,.55), rgba(6,24,20,.72));
      backdrop-filter:blur(14px);
      box-shadow:0 28px 66px rgba(0,0,0,.5);
      animation:riseIn .5s ease;
    }
    @keyframes riseIn{ from{ opacity:0; transform:translateY(22px);} to{ opacity:1; transform:none;} }
    .q-card .label{
      display:inline-flex; align-items:center; gap:8px;
      font-family:'Cairo', sans-serif;
      font-weight:800; font-size:12px; letter-spacing:1.5px;
      color:var(--gold);
      margin-bottom:16px;
    }
    .q-text{
      font-family:'Cairo', sans-serif;
      font-weight:800;
      font-size:clamp(20px, 3.2vw, 30px);
      line-height:1.75;
      margin:0;
      color:var(--ivory);
    }
    .q-media{ margin-top:22px; }

    /* ---------- مشغّل الصوت ---------- */
    .aud{
      display:flex; align-items:center; gap:14px;
      max-width:520px; margin:0 auto;
      padding:14px 18px;
      border:1px solid rgba(95,208,168,.35);
      border-radius:20px;
      background:linear-gradient(150deg, rgba(63,174,149,.16), rgba(6,24,20,.6));
      box-shadow:0 16px 40px rgba(0,0,0,.4);
      text-align:right;
    }
    .aud .play{
      flex:none;
      width:54px; height:54px;
      border-radius:50%;
      border:none;
      cursor:pointer;
      display:flex; align-items:center; justify-content:center;
      font-size:19px;
      color:#04231d;
      background:linear-gradient(135deg, var(--green-soft), var(--green));
      box-shadow:0 10px 26px rgba(63,174,149,.4);
      transition:transform .18s ease;
    }
    .aud .play:hover{ transform:scale(1.07); }
    .aud .body{ flex:1; min-width:0; }
    .aud .label{
      font-family:'Cairo', sans-serif;
      font-weight:800; font-size:13px;
      color:var(--green-soft);
      margin-bottom:8px;
      display:flex; align-items:center; gap:8px;
    }
    .aud .bar{
      height:8px; border-radius:999px;
      background:rgba(0,0,0,.4);
      border:1px solid rgba(255,255,255,.07);
      overflow:hidden;
      cursor:pointer;
    }
    .aud .fill{
      height:100%; width:0%;
      border-radius:999px;
      background:linear-gradient(90deg, var(--green), var(--green-soft));
      box-shadow:0 0 14px rgba(143,227,208,.5);
      transition:width .15s linear;
    }
    .aud .time{
      display:flex; justify-content:space-between;
      font-size:11.5px; font-weight:700; color:var(--muted);
      margin-top:6px; direction:ltr;
    }
    .eq{ display:flex; align-items:flex-end; gap:3px; height:16px; }
    .eq span{
      width:3px; border-radius:2px;
      background:var(--green-soft);
      height:5px;
      animation:eqBounce .9s ease-in-out infinite;
    }
    .eq span:nth-child(2){ animation-delay:.12s; }
    .eq span:nth-child(3){ animation-delay:.24s; }
    .eq span:nth-child(4){ animation-delay:.36s; }
    .eq.idle span{ animation:none; height:5px; opacity:.4; }
    @keyframes eqBounce{ 0%,100%{ height:5px; } 50%{ height:16px; } }
    @media (prefers-reduced-motion: reduce){ .eq span{ animation:none; } }

    /* ---------- مشغّل الفيديو ---------- */
    .vid{
      position:relative;
      max-width:640px; margin:0 auto;
      border-radius:20px;
      overflow:hidden;
      border:1px solid var(--line);
      box-shadow:0 20px 48px rgba(0,0,0,.5);
      background:#000;
    }
    /* شريط يغطّي عنوان الفيديو أعلى مشغّل يوتيوب: العنوان يذكر اسم
       الهدّاف فيكشف الإجابة قبل أن يجيب أحد. ويغطّي معه زرّ «مشاهدة
       على YouTube» لأنه طريق آخر إلى العنوان. */
    .vid > .vid-mask{
      position:absolute; z-index:2; display:block;
      background:#0a2620;
      box-shadow:inset 0 0 0 1px rgba(231,183,64,.18);
    }
    .vid video, .vid iframe{
      display:block; width:100%; aspect-ratio:16/9;
      border:none; background:#000;
    }
    /* bw: المقطع بالأبيض والأسود (ألوان القميص تكشف اللاعب)،
       وتعود ألوانه عند كشف الإجابة */
    .vid.bw video, .vid.bw iframe{ filter:grayscale(1) contrast(1.05); transition:filter .6s ease; }
    .vid.bw.shown video, .vid.bw.shown iframe{ filter:none; }
    .yt-note{ max-width:640px; margin:10px auto 0; color:var(--muted); font-size:13px; line-height:1.7; text-align:center; }
    .yt-open-row{ display:flex; flex-direction:column; align-items:center; gap:4px; margin-top:12px; }
    .yt-open-row .yt-note{ margin:0; font-size:12px; }
    .yt-open{
      display:inline-flex; align-items:center; gap:9px; padding:11px 24px; border-radius:999px;
      background:linear-gradient(135deg, var(--gold-soft), var(--gold)); color:#04120f;
      font-family:'Cairo',sans-serif; font-weight:900; font-size:15px; text-decoration:none;
      box-shadow:0 10px 26px rgba(231,183,64,.35); transition:transform .2s ease;
    }
    .yt-open:hover{ transform:translateY(-2px); }
    .yt-open small{ font-weight:700; opacity:.75; }
    .yt-note i{ color:var(--gold); }
    .yt-note a{ color:var(--gold-soft); }

    /* ---------- تنبيه ملف مفقود ---------- */
    .media-missing{
      max-width:520px; margin:0 auto;
      padding:16px 18px;
      border:1px dashed rgba(255,107,77,.5);
      border-radius:18px;
      background:rgba(255,107,77,.08);
      color:#ffb3a3;
      font-size:13.5px;
      line-height:1.9;
      text-align:center;
    }
    .media-missing code{
      background:rgba(0,0,0,.4);
      border-radius:8px; padding:2px 8px;
      color:var(--gold-soft);
      unicode-bidi:plaintext; display:inline-block;
    }
    .q-media img{
      max-width:100%;
      max-height:320px;
      border-radius:18px;
      box-shadow:0 18px 40px rgba(0,0,0,.45), 0 0 0 1px rgba(231,183,64,.15);
    }

    /* ---------- تكبير صورة السؤال ---------- */
    .q-media .zoomable{ cursor:zoom-in; }

    /* تغبيش اسم المنتج على صورة السؤال (فئة «منتجات») —
       يُرفع عند إظهار الإجابة فيظهر الاسم واضحاً. */
    .hide-wrap{ position:relative; display:inline-block; line-height:0; max-width:100%; }
    .hide-wrap > .hide-mask{
      position:absolute; display:block;
      border-radius:8px;
      -webkit-backdrop-filter:blur(16px) saturate(1.15);
              backdrop-filter:blur(16px) saturate(1.15);
      box-shadow:inset 0 0 0 1px rgba(231,183,64,.22);
    }
    /* متصفح لا يدعم التغبيش: نغطّي بلون صلب، فالأهمّ ألا ينكشف الاسم */
    @supports not ((backdrop-filter: blur(4px)) or (-webkit-backdrop-filter: blur(4px))) {
      .hide-wrap > .hide-mask{ background:#0a2620; }
    }
    /* أرقام على الخريطة (labels) — «ما اسم المنطقة رقم ٣؟» */
    .hide-wrap > .map-label{
      position:absolute; transform:translate(-50%, -50%);
      min-width:1.9em; height:1.9em; padding:0 .35em;
      display:grid; place-items:center;
      border-radius:999px;
      background:#0a2620; color:#f3e9cf;
      border:2px solid #e7b740;
      box-shadow:0 2px 6px rgba(0,0,0,.45);
      font:800 clamp(11px, 2.4vw, 17px)/1 'Cairo', sans-serif;
      pointer-events:none;
    }
    /* في الإجابة: رقم المنطقة المسؤول عنها يُبرَز */
    .hide-wrap > .map-label.on{
      background:#e7b740; color:#0a2620; border-color:#fff;
      transform:translate(-50%, -50%) scale(1.25);
    }
    .zoom-tip{
      display:inline-flex; align-items:center; gap:7px;
      margin-top:10px; padding:6px 14px;
      border-radius:999px;
      border:1px solid var(--line);
      background:rgba(4,18,15,.5);
      color:var(--muted);
      font-family:'Cairo', sans-serif; font-size:12.5px; font-weight:700;
      cursor:zoom-in;
      transition:border-color .2s ease, color .2s ease;
    }
    .zoom-tip:hover{ border-color:var(--line-strong); color:var(--ivory); }
    .zoom-tip i{ color:var(--gold); }

    #imgZoom{
      position:fixed; inset:0; z-index:200;
      display:none;
      background:rgba(2,11,9,.94);
      backdrop-filter:blur(6px);
      overscroll-behavior:contain;
      touch-action:none;
    }
    #imgZoom.on{ display:block; }
    #imgZoom .zoom-stage{
      position:absolute; inset:0;
      display:grid; place-items:center;
      overflow:hidden;
      cursor:grab;
    }
    #imgZoom .zoom-stage.dragging{ cursor:grabbing; }
    #imgZoom .zoom-stage > *{
      transform-origin:center center;
      transition:transform .12s ease-out;
      max-width:92vw; max-height:88vh;
      width:auto; height:auto;
    }
    /* الخريطة العالمية تُستنسخ بحاويتها ليبقى المؤشّر في موضعه */
    #imgZoom .zoom-stage .worldpin{ width:min(92vw, 900px); max-width:none; }
    /* خريطة الشوارع حاوية بارتفاع ثابت، فنمنحها ارتفاعاً عند التكبير */
    #imgZoom .zoom-stage .streetmap{
      width:min(92vw, 900px); height:min(88vh, 620px); max-height:88vh;
    }
    /* وصورة المنتج تُستنسخ بغلافها كذلك، ليبقى التغبيش فوق الاسم
       عند التكبير — وإلا انكشف الاسم بضغطة واحدة. */
    #imgZoom .zoom-stage .hide-wrap{ display:block; }
    #imgZoom .zoom-stage .hide-wrap img{
      max-width:92vw; max-height:88vh; width:auto; height:auto; display:block;
    }
    #imgZoom .zoom-stage img{ border-radius:14px; }

    .zoom-bar{
      position:absolute; z-index:2;
      inset-inline:0; bottom:22px;
      display:flex; justify-content:center; gap:8px;
      pointer-events:none;
    }
    .zoom-bar button{
      pointer-events:auto;
      width:52px; height:52px; border-radius:16px;
      display:grid; place-items:center;
      font-size:19px; cursor:pointer;
      color:var(--ivory);
      background:linear-gradient(180deg, rgba(13,51,45,.96), rgba(4,18,15,.96));
      border:1px solid var(--line-strong);
      box-shadow:0 10px 26px rgba(0,0,0,.5);
      transition:transform .15s ease, background .2s ease;
    }
    .zoom-bar button:hover{ transform:translateY(-2px); background:rgba(231,183,64,.16); }
    .zoom-bar button:disabled{ opacity:.4; cursor:default; transform:none; }
    .zoom-bar .lvl{
      pointer-events:none;
      min-width:74px; height:52px; border-radius:16px;
      display:grid; place-items:center;
      font-family:'Cairo', sans-serif; font-weight:800; font-size:15px;
      color:var(--gold-soft);
      background:rgba(4,18,15,.9);
      border:1px solid var(--line);
    }
    .zoom-close{
      position:absolute; z-index:2; top:18px; inset-inline-end:18px;
      width:48px; height:48px; border-radius:15px;
      display:grid; place-items:center; font-size:19px; cursor:pointer;
      color:#ff9c89;
      background:rgba(4,18,15,.9);
      border:1px solid rgba(255,107,77,.45);
    }
    .zoom-close:hover{ background:rgba(255,107,77,.16); }
    @media (max-width:600px){
      .zoom-bar button, .zoom-bar .lvl{ width:46px; height:46px; font-size:16px; }
      .zoom-bar .lvl{ min-width:64px; }
    }
    /* الأعلام على خلفية بيضاء حتى تظهر الأجزاء البيضاء منها */
    .q-media img.flagimg{
      background:#fff;
      padding:8px;
      max-height:260px;
    }
    /* الشعارات (فئات الشعارات) على خلفية بيضاء. الإطار الأبيض ظلّ لا حشوة،
       فتبقى نِسب أقنعة التغبيش (hide) مطابقة لمساحة الشعار نفسه. */
    img.logoimg{
      background:#fff;
      padding:0 !important;
      border-radius:6px !important;
      margin:0;
      max-height:240px !important;
      box-shadow:0 0 0 14px #fff, 0 18px 40px 14px rgba(0,0,0,.45) !important;
    }
    /* الهامش على الغلاف لا على الصورة، حتى لا يُزيح الأقنعة */
    .hide-wrap:has(> img.logoimg),
    .q-img-shell > img.logoimg,
    .a-media > img.logoimg{ margin:14px; }
    /* الرسوم التوضيحية (أيقونات) بحجم كبير وواضح */
    .q-media img.iconimg{
      width:230px; height:230px;
      background:radial-gradient(circle at 50% 45%, rgba(255,255,255,.14), rgba(255,255,255,.03) 65%, transparent 72%);
      padding:10px;
      box-shadow:none;
      filter:drop-shadow(0 16px 30px rgba(0,0,0,.5));
    }
    @media (max-width:600px){ .q-media img.iconimg{ width:180px; height:180px; } }

    /* الخرائط الصمّاء شفافة مع توهّج ذهبي */
    .q-media img.mapimg{
      max-height:340px;
      background:transparent;
      box-shadow:none;
      filter:drop-shadow(0 14px 30px rgba(231,183,64,.28));
    }
    /* ---------- خريطة شوارع المنطقة (streets) ----------
       بلاطات خريطة بلا أسماء مكتوبة، فتظهر الشوارع والأحياء ولا يُكشف
       اسم المنطقة، وحلقة في المنتصف على موضعها. */
    .streetmap{
      position:relative; width:min(640px, 100%); height:min(440px, 62vw);
      overflow:hidden; border-radius:18px; background:#eceff1;
      box-shadow:0 18px 40px rgba(0,0,0,.45), 0 0 0 1px rgba(231,183,64,.15);
    }
    .streetmap .tiles{ position:absolute; top:0; left:0; width:1280px; height:1280px; }
    .streetmap .tiles img{
      position:absolute; width:256px !important; height:256px !important;
      max-width:none !important; max-height:none !important;
      margin:0 !important; padding:0 !important; border-radius:0 !important;
      background:none !important; box-shadow:none !important;
      /* بلاطات الأساس رمادية فاتحة جداً، فنرفع التباين ليظهر خطّ الشارع */
      filter:invert(1) brightness(3.5) invert(1);
    }
    /* طبقة أسماء الشوارع تُعرض كما هي فوق الأساس */
    .streetmap .tiles.labels img{ filter:none; }
    .streetmap .wp-ring{ left:50%; top:50%; }
    .map-credit{
      display:block; margin-top:6px; color:var(--muted);
      font-size:11.5px; direction:ltr; text-align:center;
    }

    /* ---------- خريطة العالم مع مؤشّر الدولة (فئة الخرائط) ---------- */
    .worldpin{ position:relative; display:inline-block; width:100%; max-width:620px; line-height:0; }
    .worldpin > img.wp-map{
      width:100%; height:auto; display:block;
      border-radius:18px; background:#fff;
      box-shadow:0 16px 40px rgba(0,0,0,.45);
    }
    .wp-ring{
      position:absolute; width:5.4%; aspect-ratio:1;
      transform:translate(-50%,-50%);
      border-radius:50%;
      border:2.5px solid var(--coral, #ff6b4d);
      box-shadow:0 0 0 2px rgba(255,255,255,.85), 0 0 16px 4px rgba(255,107,77,.55);
      animation:wpPulse 1.9s ease-in-out infinite;
      pointer-events:none;
    }
    .wp-ring::after{
      content:""; position:absolute; inset:38%;
      border-radius:50%; background:var(--coral, #ff6b4d);
    }
    @keyframes wpPulse{ 0%,100%{ transform:translate(-50%,-50%) scale(1); } 50%{ transform:translate(-50%,-50%) scale(1.18); } }
    @media (prefers-reduced-motion: reduce){ .wp-ring{ animation:none; } }
    .wp-shape{
      position:absolute; inset-inline-start:8px; bottom:8px;
      width:22%; max-width:120px; height:auto;
      padding:6px 6px 4px;
      border-radius:12px;
      background:linear-gradient(180deg, rgba(13,51,45,.94), rgba(4,18,15,.94));
      border:1px solid rgba(231,183,64,.45);
      box-shadow:0 6px 18px rgba(0,0,0,.45);
    }
    .wp-shape-lbl{
      position:absolute; inset-inline-start:8px; bottom:8px;
      transform:translateY(calc(100% + 4px));
      font-family:'Cairo', sans-serif; font-size:10px; color:var(--muted, #9fc2bb);
    }

    .q-media audio{ width:100%; max-width:420px; margin-top:6px; }

    /* ---------- الترجمة الآلية ---------- */
    .q-text.translating{ opacity:.55; }
    .orig{
      display:block; margin-top:12px;
      font-family:'Tajawal',sans-serif; font-size:15px; font-weight:400;
      color:var(--muted); opacity:.75; line-height:1.7;
      border-top:1px dashed rgba(231,183,64,.2); padding-top:11px;
    }
    #mtBadge{
      display:inline-flex; align-items:center; gap:7px;
      font-family:'Cairo',sans-serif; font-weight:700; font-size:12px;
      color:#bfe6db; background:rgba(63,174,149,.16);
      border:1px solid rgba(95,208,168,.4); border-radius:999px;
      padding:7px 15px;
    }

    /* ---------- شريط المفاجأة ---------- */
    .surprise{
      max-width:760px; margin:0 auto 20px; padding:15px 20px;
      display:flex; align-items:center; gap:15px;
      border-radius:18px; text-align:start;
      border:1px solid var(--line-strong);
      background:linear-gradient(150deg, rgba(231,183,64,.16), rgba(4,18,15,.6));
      animation:surprisePop .5s cubic-bezier(.2,.9,.3,1.4);
    }
    .surprise.bad{
      border-color:rgba(255,107,77,.55);
      background:linear-gradient(150deg, rgba(255,107,77,.18), rgba(4,18,15,.6));
    }
    .surprise .em{ font-size:38px; line-height:1; flex:none; }
    .surprise .tx{ display:flex; flex-direction:column; gap:3px; }
    .surprise .tx b{ font-family:'Cairo',sans-serif; font-size:17px; color:var(--gold-soft); }
    .surprise.bad .tx b{ color:#ffb3a1; }
    .surprise .tx small{ color:var(--muted); font-size:13.5px; }
    @keyframes surprisePop{ from{ transform:scale(.86); opacity:0; } to{ transform:scale(1); opacity:1; } }
    @media (prefers-reduced-motion: reduce){ .surprise{ animation:none; } }

    /* ---------- المساعدات ---------- */
    .helps{
      max-width:760px; margin:0 auto 18px; padding:13px 18px;
      border-radius:16px; border:1px solid var(--line);
      background:rgba(21,74,65,.32);
      display:flex; align-items:center; justify-content:center;
      gap:14px; flex-wrap:wrap;
    }
    .helps-label{ font-size:13px; color:var(--muted); font-weight:700; }
    .helps-label i{ color:var(--gold); }
    .helps-label b{ color:var(--gold-soft); }
    .helps-row{ display:flex; gap:9px; flex-wrap:wrap; justify-content:center; }
    .help-btn{
      display:inline-flex; align-items:center; gap:7px;
      padding:9px 15px; border-radius:14px; cursor:pointer;
      border:1px solid var(--line); background:rgba(4,18,15,.5);
      color:var(--ivory); font-family:'Cairo',sans-serif; font-size:13px; font-weight:700;
      transition:border-color .18s ease, transform .18s ease, background .18s ease;
    }
    .help-btn:hover:not(:disabled){ transform:translateY(-2px); border-color:var(--line-strong);
      background:rgba(231,183,64,.12); }
    .help-btn:disabled{ opacity:.32; cursor:not-allowed; }
    .help-btn .em{ font-size:16px; }
    .help-btn .n{
      background:rgba(231,183,64,.2); color:var(--gold-soft);
      border-radius:8px; padding:1px 7px; font-size:11.5px; font-weight:900;
    }

    /* خيارا مساعدة «جوابين» */
    .two-answers{ max-width:760px; margin:0 auto 20px; }
    .ta-label{ display:block; color:var(--muted); font-size:13.5px; margin-bottom:10px; }
    .ta-opts{ display:grid; gap:11px; grid-template-columns:repeat(auto-fit,minmax(220px,1fr)); }
    .ta-opt{
      padding:15px 18px; border-radius:16px;
      border:1px solid var(--line-strong); background:rgba(21,74,65,.4);
      color:var(--ivory); font-family:'Cairo',sans-serif; font-weight:700; font-size:16px;
    }

    /* ---------- مكالمة ---------- */
    #callOverlay{
      position:fixed; inset:0; z-index:1500; display:none;
      align-items:center; justify-content:center;
      background:rgba(2,11,9,.82); backdrop-filter:blur(8px);
    }
    #callOverlay.on{ display:flex; }
    .call-card{
      text-align:center; padding:38px 46px; border-radius:26px;
      background:linear-gradient(165deg,#0f3a33,#061a16);
      border:1px solid var(--line-strong); box-shadow:0 40px 90px rgba(0,0,0,.6);
    }
    .call-card .ring{ font-size:56px; animation:shake 1s ease-in-out infinite; }
    @keyframes shake{ 0%,100%{ transform:rotate(-9deg);} 50%{ transform:rotate(9deg);} }
    @media (prefers-reduced-motion: reduce){ .call-card .ring{ animation:none; } }
    .call-card h3{ font-family:'Cairo',sans-serif; color:var(--gold-soft); margin:14px 0 6px; }
    .call-card .cnum{
      font-family:'Cairo',sans-serif; font-size:56px; font-weight:900; color:var(--gold);
      line-height:1;
    }
    .call-card p{ color:var(--muted); margin:10px 0 20px; font-size:14px; }

    /* غلاف صورة السؤال — يعرض بطاقة مولّدة ثم يبدّلها بالصورة الحقيقية */
    .q-img-shell{ position:relative; display:flex; justify-content:center; }
    /* خريطة الشوارع: الخريطة ثم سطر المصدر تحتها */
    .q-img-shell:has(> .streetmap){ flex-direction:column; align-items:center; }
    .q-img-shell img{ transition:opacity .35s ease, filter .35s ease; }
    .q-img-shell.loading img{ opacity:.72; filter:saturate(.7); }
    .q-img-shell.loading::after{
      content:""; position:absolute; top:14px; inset-inline-end:14px;
      width:20px; height:20px; border-radius:50%;
      border:2px solid rgba(231,183,64,.25); border-top-color:var(--gold);
      animation:imgspin .8s linear infinite;
    }
    @keyframes imgspin{ to{ transform:rotate(360deg); } }
    @media (prefers-reduced-motion: reduce){ .q-img-shell.loading::after{ animation:none; } }

    .a-card{
      margin-top:20px;
      border:1px solid rgba(95,208,168,.4);
      border-radius:26px;
      padding:28px 30px;
      background:linear-gradient(150deg, rgba(63,174,149,.2), rgba(6,24,20,.7));
      backdrop-filter:blur(14px);
      box-shadow:0 22px 54px rgba(0,0,0,.45), 0 0 40px rgba(95,208,168,.12);
      animation:revealIn .45s cubic-bezier(.2,.9,.3,1.2);
    }
    @keyframes revealIn{ from{ opacity:0; transform:translateY(-10px) scale(.98);} to{ opacity:1; transform:none;} }

    /* ---------- صورة الإجابة ---------- */
    .a-media{ margin-top:16px; display:flex; flex-direction:column; align-items:center; gap:8px; }
    .a-media img{
      max-width:100%;
      max-height:240px;
      border-radius:16px;
      cursor:zoom-in;
      background:#fff;
      box-shadow:0 14px 32px rgba(0,0,0,.45), 0 0 0 1px rgba(95,208,168,.25);
      animation:revealIn .4s ease backwards;
    }
    .a-media .cap{
      font-family:'Cairo', sans-serif; font-size:12px; font-weight:700;
      color:var(--muted);
      display:inline-flex; align-items:center; gap:6px;
    }
    .a-media .cap i{ color:#5fd0a8; }
    .a-media.loading::before{
      content:""; width:22px; height:22px; border-radius:50%;
      border:2px solid rgba(95,208,168,.25); border-top-color:#5fd0a8;
      animation:imgspin .8s linear infinite;
    }
    .a-card .label{ color:var(--green-soft); }
    .a-text{
      font-family:'Cairo', sans-serif;
      font-weight:900;
      font-size:clamp(19px, 2.8vw, 27px);
      line-height:1.7;
      margin:0;
      color:#fff;
    }

    /* ---------- buttons ---------- */
    .btn-row{ display:flex; gap:12px; justify-content:center; flex-wrap:wrap; margin-top:26px; }
    .btn{
      display:inline-flex; align-items:center; justify-content:center; gap:10px;
      font-family:'Cairo', sans-serif;
      font-weight:800; font-size:16px;
      border-radius:999px;
      padding:15px 32px;
      border:none;
      cursor:pointer;
      text-decoration:none;
      transition:transform .18s ease, box-shadow .18s ease, background .2s ease;
    }
    .btn:hover{ transform:translateY(-3px); }
    .btn:focus-visible{ outline:3px solid var(--gold); outline-offset:3px; }
    .btn-gold{
      position:relative; overflow:hidden;
      background:linear-gradient(135deg, var(--gold-soft), var(--gold));
      color:var(--ink-deep);
      box-shadow:0 14px 32px rgba(231,183,64,.38);
    }
    .btn-gold::after{
      content:"";
      position:absolute; top:0; bottom:0; width:60px;
      background:linear-gradient(90deg, transparent, rgba(255,255,255,.55), transparent);
      transform:skewX(-20deg);
      animation:shine 3.4s ease-in-out infinite;
    }
    @keyframes shine{ 0%{ right:-80px; } 55%,100%{ right:120%; } }
    @media (prefers-reduced-motion: reduce){ .btn-gold::after{ animation:none; } }
    .btn-ghost{
      background:transparent;
      border:1.5px solid var(--line-strong);
      color:var(--gold-soft);
    }
    .btn-ghost:hover{ background:rgba(231,183,64,.1); }

    /* ---------- scoring ---------- */
    .score-panel{
      margin-top:24px;
      border:1px solid var(--line);
      border-radius:26px;
      padding:26px 24px;
      background:linear-gradient(150deg, rgba(21,74,65,.5), rgba(6,24,20,.68));
      backdrop-filter:blur(14px);
      box-shadow:0 22px 54px rgba(0,0,0,.45);
      animation:riseIn .45s ease;
    }
    .score-panel h4{
      font-family:'Cairo', sans-serif;
      font-weight:900; font-size:18px;
      margin:0 0 18px;
      color:var(--ivory);
      display:flex; align-items:center; justify-content:center; gap:9px;
    }
    .score-panel h4 i{ color:var(--gold); }
    .team-btns{ display:flex; gap:12px; justify-content:center; flex-wrap:wrap; }
    .team-btn{
      flex:1 1 200px;
      max-width:270px;
      display:flex; flex-direction:column; align-items:center; gap:6px;
      border-radius:20px;
      padding:18px 16px;
      border:1.5px solid rgba(255,255,255,.1);
      background:rgba(0,0,0,.24);
      color:var(--ivory);
      font-family:'Cairo', sans-serif;
      cursor:pointer;
      transition:transform .2s ease, border-color .2s ease, background .2s ease, box-shadow .2s ease;
    }
    .team-btn span.nm{ font-weight:900; font-size:17px; }
    .team-btn span.sc{ font-size:12.5px; color:var(--muted); font-weight:700; }
    /* أسماء لاعبي الفريق — سطر واحد يُختصر إن طال */
    .team-btn span.mem{
      font-size:12px; color:var(--ivory); opacity:.8; font-weight:600; max-width:100%;
      white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
    }
    .team-btn i{ font-size:18px; margin-bottom:2px; }
    /* لون كل فريق من teams.js عبر --tc */
    .team-btn.team i{ color:var(--tc); }
    .team-btn.team:hover{ border-color:var(--tc); background:rgba(255,255,255,.06); transform:translateY(-4px); box-shadow:0 14px 32px rgba(0,0,0,.3); }
    /* ٤ أو ٦ فرق: أزرار أصغر ثلاثة في الصف */
    .team-btns.many .team-btn{ flex:1 1 150px; max-width:210px; padding:13px 10px; }
    .team-btns.many .team-btn span.nm{ font-size:15px; }

    /* اختيار الخصم لمساعدات الخصم حين تكون الفرق أكثر من اثنين */
    .pick-team{ position:fixed; inset:0; z-index:1500; display:flex; align-items:center; justify-content:center;
      background:rgba(3,14,12,.78); backdrop-filter:blur(6px); -webkit-backdrop-filter:blur(6px); padding:18px; }
    .pick-team .pt-card{ width:min(440px,100%); background:linear-gradient(160deg,#0f3a33,#0a2a25);
      border:1px solid rgba(231,183,64,.45); border-radius:22px; padding:20px; text-align:center;
      box-shadow:0 30px 80px rgba(0,0,0,.5); font-family:'Cairo',sans-serif; }
    .pick-team h5{ margin:0 0 14px; color:var(--gold-soft); font-size:18px; font-weight:900; }
    .pick-team .pt-list{ display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); gap:10px; }
    .pick-team .pt-btn{ display:flex; flex-direction:column; align-items:center; gap:2px; padding:12px 8px;
      border-radius:14px; border:1.5px solid var(--tc); background:rgba(0,0,0,.25); color:var(--ivory);
      font-family:inherit; font-weight:800; cursor:pointer; }
    .pick-team .pt-btn small{ color:var(--muted); font-weight:700; }
    .pick-team .pt-btn:disabled{ opacity:.45; cursor:not-allowed; }
    .pick-team .pt-none{ color:var(--gold-soft); }
    .pick-team .pt-cancel{ margin-top:14px; background:none; border:0; color:var(--muted); font-family:inherit;
      text-decoration:underline; cursor:pointer; }
    .team-btn.none i{ color:var(--muted); }
    .team-btn.none:hover{ border-color:var(--line-strong); background:rgba(255,255,255,.05); transform:translateY(-4px); }
    .team-btn.turn{ border-color:var(--gold); box-shadow:0 0 0 1px rgba(231,183,64,.3); }


    .hint{
      color:var(--muted);
      font-size:13px;
      margin-top:16px;
    }
    .hint i{ color:var(--gold); }

    .missing{
      color:var(--muted);
      font-size:15px;
      line-height:2;
    }
    .missing code{
      background:rgba(0,0,0,.35);
      border:1px solid var(--line);
      border-radius:8px;
      padding:2px 8px;
      color:var(--gold-soft);
      font-size:13px;
      unicode-bidi:plaintext;
      display:inline-block;
    }

    /* ---------- toast ---------- */
    #toastBox{
      position:fixed; bottom:26px; left:50%;
      transform:translateX(-50%);
      z-index:999;
      display:flex; flex-direction:column; gap:10px; align-items:center;
      pointer-events:none;
    }
    .toast{
      background:linear-gradient(135deg, rgba(13,51,45,.97), rgba(4,18,15,.97));
      border:1px solid var(--line-strong);
      color:var(--ivory);
      font-family:'Cairo', sans-serif;
      font-weight:700; font-size:14.5px;
      padding:14px 22px;
      border-radius:14px;
      box-shadow:var(--shadow-lg);
      display:flex; align-items:center; gap:10px;
      animation:toastIn .3s ease;
    }
    .toast i{ color:var(--gold); }
    @keyframes toastIn{ from{ opacity:0; transform:translateY(18px);} to{ opacity:1; transform:none; } }

    @media (max-width:600px){
