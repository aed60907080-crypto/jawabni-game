<!DOCTYPE html>
<html lang="ar">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="referrer" content="strict-origin-when-cross-origin">
  <title>مقطع — جاوبني</title>
  <style>
    html, body { margin:0; height:100%; background:#000; overflow:hidden; }
    iframe { display:block; width:100%; height:100%; border:0; }
  </style>
</head>
<body>
<!-- ============================================================
     جاوبني — وسيط مشغّل يوتيوب
     ------------------------------------------------------------
     يوتيوب يرفض التشغيل المضمَّن (الخطأ 153) إن لم تُرسل الصفحة عنوانها،
     والصفحة المفتوحة كملف من الجهاز (file://) لا عنوان لها. فحين تُفتح
     اللعبة كملف تضمّن هذه الصفحة من موقع اللعبة على GitHub Pages، وهي
     تضمّن يوتيوب — فيصله عنوان الموقع ويعمل المقطع.
       yt.html?v=معرّف_الفيديو&s=البداية&e=النهاية   (بالثواني)
     ============================================================ -->
<script>
  (function () {
    var p = new URLSearchParams(location.search);
    var id = (p.get("v") || "").replace(/[^A-Za-z0-9_-]/g, "");
    if (!id) return;
    var s = parseInt(p.get("s"), 10), e = parseInt(p.get("e"), 10);
    var url = "https://www.youtube-nocookie.com/embed/" + id + "?rel=0&modestbranding=1" +
              (s >= 0 ? "&start=" + s : "") + (e > 0 ? "&end=" + e : "");
    /* go=1: ننتقل إلى المشغّل نفسه (نافذة «شغّل المقطع» من لعبة مفتوحة كملف) —
       الانتقال من هذه الصفحة يُرسل عنوان الموقع فيقبله يوتيوب */
    if (p.get("go") === "1") { location.replace(url + "&autoplay=1"); return; }
    var f = document.createElement("iframe");
    f.allow = "accelerometer; encrypted-media; picture-in-picture";
    f.allowFullscreen = true;
    f.referrerPolicy = "strict-origin-when-cross-origin";
    f.src = url;
    document.body.appendChild(f);
  })();
</script>
</body>
</html>
