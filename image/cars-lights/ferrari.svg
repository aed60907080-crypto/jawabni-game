<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" width="1200" height="760">
  <rect width="1200" height="760" fill="#000"/>
  <defs>
    <linearGradient id="body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0"   stop-color="#44536b"/>
      <stop offset=".25" stop-color="#27303f"/>
      <stop offset=".70" stop-color="#151c26"/>
      <stop offset="1"   stop-color="#090d13"/>
    </linearGradient>
    <linearGradient id="sheen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0"   stop-color="#ffffff" stop-opacity=".20"/>
      <stop offset=".34" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="lens">
      <stop offset="0"   stop-color="#3d5068"/>
      <stop offset=".70" stop-color="#18202b"/>
      <stop offset="1"   stop-color="#0b1016"/>
    </radialGradient>
    <radialGradient id="bulb">
      <stop offset="0"   stop-color="#ff2f2a" stop-opacity=".95"/>
      <stop offset=".55" stop-color="#ff2f2a" stop-opacity=".32"/>
      <stop offset="1"   stop-color="#ff2f2a" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="bloom">
      <stop offset="0"   stop-color="#ff2f2a" stop-opacity=".50"/>
      <stop offset=".45" stop-color="#ff2f2a" stop-opacity=".16"/>
      <stop offset="1"   stop-color="#ff2f2a" stop-opacity="0"/>
    </radialGradient>
    <filter id="glow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="20" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="b"/><feMergeNode in="b"/></feMerge>
    </filter>
    <filter id="soft" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="55"/>
    </filter>
  </defs>
  <g transform="translate(82,0)"><ellipse cx="858" cy="392" rx="320" ry="200" fill="url(#bloom)" filter="url(#soft)"/><path d="M 616 330 L 1060 314 C 1090 313 1100 326 1100 348 L 1100 436 C 1100 458 1090 470 1060 469 L 616 453 C 598 452 596 334 616 330 Z" fill="url(#body)"/><path d="M 616 330 L 1060 314 C 1090 313 1100 326 1100 348 L 1100 436 C 1100 458 1090 470 1060 469 L 616 453 C 598 452 596 334 616 330 Z" fill="url(#sheen)"/><path d="M 616 330 L 1060 314 C 1090 313 1100 326 1100 348 L 1100 436 C 1100 458 1090 470 1060 469 L 616 453 C 598 452 596 334 616 330 Z" fill="none" stroke="#8ea4bd" stroke-width="3" opacity=".55"/><path d="M 616 330 L 1060 314 C 1090 313 1100 326 1100 348 L 1100 436 C 1100 458 1090 470 1060 469 L 616 453 C 598 452 596 334 616 330 Z" fill="none" stroke="#000" stroke-width="1" opacity=".6"/><g filter="url(#glow)" fill="none" stroke="#ff2f2a" stroke-width="20" stroke-linecap="round" stroke-linejoin="round"><circle cx="820" cy="388" r="62"/></g><g fill="none" stroke="#ff2f2a" stroke-width="20" opacity=".92" stroke-linecap="round" stroke-linejoin="round"><circle cx="820" cy="388" r="62"/></g><g fill="none" stroke="#ffffff" stroke-width="7.2" opacity=".92" stroke-linecap="round" stroke-linejoin="round"><circle cx="820" cy="388" r="62"/></g></g>
  <g transform="translate(1200,0) scale(-1,1)"><g transform="translate(82,0)"><ellipse cx="858" cy="392" rx="320" ry="200" fill="url(#bloom)" filter="url(#soft)"/><path d="M 616 330 L 1060 314 C 1090 313 1100 326 1100 348 L 1100 436 C 1100 458 1090 470 1060 469 L 616 453 C 598 452 596 334 616 330 Z" fill="url(#body)"/><path d="M 616 330 L 1060 314 C 1090 313 1100 326 1100 348 L 1100 436 C 1100 458 1090 470 1060 469 L 616 453 C 598 452 596 334 616 330 Z" fill="url(#sheen)"/><path d="M 616 330 L 1060 314 C 1090 313 1100 326 1100 348 L 1100 436 C 1100 458 1090 470 1060 469 L 616 453 C 598 452 596 334 616 330 Z" fill="none" stroke="#8ea4bd" stroke-width="3" opacity=".55"/><path d="M 616 330 L 1060 314 C 1090 313 1100 326 1100 348 L 1100 436 C 1100 458 1090 470 1060 469 L 616 453 C 598 452 596 334 616 330 Z" fill="none" stroke="#000" stroke-width="1" opacity=".6"/><g filter="url(#glow)" fill="none" stroke="#ff2f2a" stroke-width="20" stroke-linecap="round" stroke-linejoin="round"><circle cx="820" cy="388" r="62"/></g><g fill="none" stroke="#ff2f2a" stroke-width="20" opacity=".92" stroke-linecap="round" stroke-linejoin="round"><circle cx="820" cy="388" r="62"/></g><g fill="none" stroke="#ffffff" stroke-width="7.2" opacity=".92" stroke-linecap="round" stroke-linejoin="round"><circle cx="820" cy="388" r="62"/></g></g></g>
</svg>
