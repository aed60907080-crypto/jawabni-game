      <stop offset=".55" stop-color="#eaf6ff" stop-opacity=".32"/>
      <stop offset="1"   stop-color="#eaf6ff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="bloom">
      <stop offset="0"   stop-color="#eaf6ff" stop-opacity=".50"/>
      <stop offset=".45" stop-color="#eaf6ff" stop-opacity=".16"/>
      <stop offset="1"   stop-color="#eaf6ff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="haze">
