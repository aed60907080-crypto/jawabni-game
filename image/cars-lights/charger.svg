<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" width="1200" height="760">
  <rect width="1200" height="760" fill="#000"/>
  <defs>
    <linearGradient id="body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0"   stop-color="#44536b"/>
      <stop offset=".25" stop-color="#27303f"/>
      <stop offset=".70" stop-color="#151c26"/>
      <stop offset="1"   stop-color="#090d13"/>
    </linearGradient>
    <linearGradient id="sheen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0"   stop-color="#ffffff" stop-opacity=".20"/>
      <stop offset=".34" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="lens">
      <stop offset="0"   stop-color="#3d5068"/>
      <stop offset=".70" stop-color="#18202b"/>
      <stop offset="1"   stop-color="#0b1016"/>
    </radialGradient>
    <radialGradient id="bulb">
      <stop offset="0"   stop-color="#ff2f2a" stop-opacity=".95"/>
      <stop offset=".55" stop-color="#ff2f2a" stop-opacity=".32"/>
      <stop offset="1"   stop-color="#ff2f2a" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="bloom">
      <stop offset="0"   stop-color="#ff2f2a" stop-opacity=".50"/>
      <stop offset=".45" stop-color="#ff2f2a" stop-opacity=".16"/>
      <stop offset="1"   stop-color="#ff2f2a" stop-opacity="0"/>
    </radialGradient>
    <filter id="glow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="20" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="b"/><feMergeNode in="b"/></feMerge>
    </filter>
    <filter id="soft" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="55"/>
    </filter>
  </defs>
  <ellipse cx="600" cy="380" rx="620" ry="150" fill="url(#bloom)" filter="url(#soft)"/><path d="M 112 320 L 1088 320 C 1104 320 1112 336 1112 364 L 1112 396 C 1112 424 1104 440 1088 440 L 112 440 C 96 440 88 424 88 396 L 88 364 C 88 336 96 320 112 320 Z" fill="url(#body)"/><path d="M 112 320 L 1088 320 C 1104 320 1112 336 1112 364 L 1112 396 C 1112 424 1104 440 1088 440 L 112 440 C 96 440 88 424 88 396 L 88 364 C 88 336 96 320 112 320 Z" fill="url(#sheen)"/><path d="M 112 320 L 1088 320 C 1104 320 1112 336 1112 364 L 1112 396 C 1112 424 1104 440 1088 440 L 112 440 C 96 440 88 424 88 396 L 88 364 C 88 336 96 320 112 320 Z" fill="none" stroke="#8ea4bd" stroke-width="3" opacity=".55"/><path d="M 112 320 L 1088 320 C 1104 320 1112 336 1112 364 L 1112 396 C 1112 424 1104 440 1088 440 L 112 440 C 96 440 88 424 88 396 L 88 364 C 88 336 96 320 112 320 Z" fill="none" stroke="#000" stroke-width="1" opacity=".6"/><g filter="url(#glow)" fill="none" stroke="#ff2f2a" stroke-width="14" stroke-linecap="round" stroke-linejoin="round"><rect x="132" y="336" width="936" height="88" rx="44"/></g><g fill="none" stroke="#ff2f2a" stroke-width="14" opacity=".92" stroke-linecap="round" stroke-linejoin="round"><rect x="132" y="336" width="936" height="88" rx="44"/></g><g fill="none" stroke="#ffffff" stroke-width="5.0" opacity=".92" stroke-linecap="round" stroke-linejoin="round"><rect x="132" y="336" width="936" height="88" rx="44"/></g>
</svg>
