<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" width="1200" height="760">
  <rect width="1200" height="760" fill="#000"/>
  <defs>
    <linearGradient id="body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0"   stop-color="#44536b"/>
      <stop offset=".25" stop-color="#27303f"/>
      <stop offset=".70" stop-color="#151c26"/>
      <stop offset="1"   stop-color="#090d13"/>
    </linearGradient>
    <linearGradient id="sheen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0"   stop-color="#ffffff" stop-opacity=".20"/>
      <stop offset=".34" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="lens">
      <stop offset="0"   stop-color="#3d5068"/>
      <stop offset=".70" stop-color="#18202b"/>
      <stop offset="1"   stop-color="#0b1016"/>
    </radialGradient>
    <radialGradient id="bulb">
      <stop offset="0"   stop-color="#6cc2ff" stop-opacity=".95"/>
      <stop offset=".55" stop-color="#6cc2ff" stop-opacity=".32"/>
      <stop offset="1"   stop-color="#6cc2ff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="bloom">
      <stop offset="0"   stop-color="#6cc2ff" stop-opacity=".50"/>
      <stop offset=".45" stop-color="#6cc2ff" stop-opacity=".16"/>
      <stop offset="1"   stop-color="#6cc2ff" stop-opacity="0"/>
    </radialGradient>
    <filter id="glow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="20" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="b"/><feMergeNode in="b"/></feMerge>
    </filter>
    <filter id="soft" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="55"/>
    </filter>
  </defs>
  <g transform="translate(82,0)"><ellipse cx="860" cy="396" rx="330" ry="190" fill="url(#bloom)" filter="url(#soft)"/><path d="M 612 404 C 726 352 906 324 1072 336 C 1100 338 1108 360 1099 394 C 1088 436 1050 456 1000 461 C 848 474 700 452 630 429 C 606 421 598 412 612 404 Z" fill="url(#body)"/><path d="M 612 404 C 726 352 906 324 1072 336 C 1100 338 1108 360 1099 394 C 1088 436 1050 456 1000 461 C 848 474 700 452 630 429 C 606 421 598 412 612 404 Z" fill="url(#sheen)"/><path d="M 612 404 C 726 352 906 324 1072 336 C 1100 338 1108 360 1099 394 C 1088 436 1050 456 1000 461 C 848 474 700 452 630 429 C 606 421 598 412 612 404 Z" fill="none" stroke="#8ea4bd" stroke-width="3" opacity=".55"/><path d="M 612 404 C 726 352 906 324 1072 336 C 1100 338 1108 360 1099 394 C 1088 436 1050 456 1000 461 C 848 474 700 452 630 429 C 606 421 598 412 612 404 Z" fill="none" stroke="#000" stroke-width="1" opacity=".6"/><ellipse cx="830" cy="392" rx="50" ry="43" fill="url(#lens)"/><ellipse cx="830" cy="392" rx="50" ry="43" fill="none" stroke="#8ea4bd" stroke-width="2.5" opacity=".45"/><ellipse cx="830" cy="392" rx="22" ry="19" fill="url(#bulb)"/><g filter="url(#glow)" fill="none" stroke="#6cc2ff" stroke-width="14" stroke-linecap="round" stroke-linejoin="round"><path d="M652 398 L1054 348"/><path d="M700 430 L768 462 L1046 404"/></g><g fill="none" stroke="#6cc2ff" stroke-width="14" opacity=".92" stroke-linecap="round" stroke-linejoin="round"><path d="M652 398 L1054 348"/><path d="M700 430 L768 462 L1046 404"/></g><g fill="none" stroke="#ffffff" stroke-width="5.0" opacity=".92" stroke-linecap="round" stroke-linejoin="round"><path d="M652 398 L1054 348"/><path d="M700 430 L768 462 L1046 404"/></g></g>
