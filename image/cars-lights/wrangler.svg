<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" width="1200" height="760">
  <rect width="1200" height="760" fill="#000"/>
  <defs>
    <filter id="glow" x="-70%" y="-70%" width="240%" height="240%">
      <feGaussianBlur stdDeviation="26" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="b"/><feMergeNode in="b"/></feMerge>
    </filter>
  </defs>
  <g filter="url(#glow)" fill="none" stroke="#ffd98a" stroke-width="28"
     stroke-linecap="round" stroke-linejoin="round">
    <circle cx="300" cy="380" r="105"/>
    <g transform="translate(1200,0) scale(-1,1)"><circle cx="300" cy="380" r="105"/></g>
  </g>
  <g fill="none" stroke="#ffd98a" stroke-width="28" opacity=".85"
     stroke-linecap="round" stroke-linejoin="round">
    <circle cx="300" cy="380" r="105"/>
    <g transform="translate(1200,0) scale(-1,1)"><circle cx="300" cy="380" r="105"/></g>
  </g>
  <g fill="none" stroke="#ffffff" stroke-width="9.5" opacity=".92"
     stroke-linecap="round" stroke-linejoin="round">
    <circle cx="300" cy="380" r="105"/>
    <g transform="translate(1200,0) scale(-1,1)"><circle cx="300" cy="380" r="105"/></g>
  </g>
</svg>
